<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>KampKiepie - Book Your Stay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#F97316;
  --brand-l:#FFF7ED;
  --brand-d:#EA580C;
  --ok:#16A34A;
  --ok-l:#F0FDF4;
  --warn:#D97706;
  --warn-l:#FFFBEB;
  --bad:#DC2626;
  --bad-l:#FEF2F2;
  --bg:#F4F4F6;
  --text:#18181B;
  --muted:#6B7280;
  --subtle:#9CA3AF;
  --border:#E4E4E7;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-y:scroll;scrollbar-gutter:stable;}
body{
  font-family:'Nunito',sans-serif;
  background:
    radial-gradient(circle at top left, rgba(249,115,22,.10), transparent 24%),
    radial-gradient(circle at top right, rgba(22,163,74,.08), transparent 26%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}
.topbar{
  position:sticky;top:0;z-index:100;
  min-height:60px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:10px 16px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}
.logo{
  width:34px;height:34px;border-radius:9px;background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;flex:0 0 auto;
}
.brandname{
  font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
}
.back-link{
  font-family:'Nunito',sans-serif;font-size:12.5px;font-weight:800;
  color:var(--muted);text-decoration:none;white-space:nowrap;flex-shrink:0;
  padding:6px 11px;border-radius:20px;background:var(--bg);border:1.5px solid var(--border);
  transition:border-color .15s,color .15s;
  max-width:42vw;overflow:hidden;text-overflow:ellipsis;
}
.back-link:hover{border-color:var(--brand);color:var(--brand);}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 56px}
.hero{
  background:linear-gradient(135deg, var(--brand), var(--brand-d));
  color:#fff;border-radius:18px;padding:26px 22px;margin-bottom:16px;
  box-shadow:var(--sh);
}
.hero h1{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;line-height:1.2}
.hero p{margin-top:8px;font-size:14px;font-weight:700;opacity:.92;max-width:560px}
.card{
  background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);
  padding:16px;margin-bottom:16px;
}
.searchgrid{
  display:grid;grid-template-columns:1fr;gap:12px
}
@media(min-width:760px){.searchgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.searchgrid{grid-template-columns:repeat(5,minmax(0,1fr)) auto}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.input,.select{
  height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;
  font-size:14px;font-weight:700;outline:none;transition:border-color .18s,background .18s;width:100%
}
.input:focus,.select:focus{background:#fff;border-color:var(--brand)}
.stepper{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;height:44px;padding:0 6px}
.stepper button{
  width:32px;height:32px;border:none;border-radius:8px;background:#fff;color:var(--brand-d);
  font-size:16px;font-weight:900;cursor:pointer;flex:0 0 auto
}
.stepper span{flex:1;text-align:center;font-weight:800;font-size:14px}
.btn{
  height:44px;border:none;border-radius:10px;padding:0 18px;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap
}
.btn-brand{background:var(--brand);color:#fff}
.btn-brand:hover{background:var(--brand-d)}
.btn-soft{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-soft:hover{background:#fff}
.btn-block{width:100%}
.resultsHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.resultsHead h2{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800}
.pill{background:var(--brand-l);color:var(--brand-d);font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px}
.standgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:700px){.standgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1040px){.standgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.standcard{
  background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--sh);
  display:flex;flex-direction:column;cursor:pointer;transition:transform .15s;
}
.standcard:hover{transform:translateY(-2px)}
.standcard .thumb{
  height:120px;background:linear-gradient(135deg, var(--brand-l), #FFEDD5);
  display:flex;align-items:center;justify-content:center;font-size:38px
}
.standcard .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.standcard h3{font-family:'Poppins',sans-serif;font-size:15px;font-weight:800}
.standcard .type{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.standcard .desc{font-size:12px;color:var(--muted);font-weight:700;line-height:1.5;flex:1}
.standcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:var(--bg);color:var(--muted)}
.standcard .pricerow{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.standcard .price{font-family:'Poppins',sans-serif;font-size:18px;font-weight:800;color:var(--brand-d)}
.standcard .pricesub{font-size:11px;color:var(--subtle);font-weight:700}
.notice{border-radius:12px;padding:14px 16px;font-size:13px;font-weight:700;line-height:1.55}
.notice.info{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
.notice.warn{background:var(--warn-l);color:#92400E;border:1px solid #FCD34D}
.notice.ok{background:var(--ok-l);color:#166534;border:1px solid #BBF7D0}
.notice.bad{background:var(--bad-l);color:#991B1B;border:1px solid #FECACA}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:40px 16px}
.small{font-size:12px;color:var(--muted);font-weight:700;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:flex-end;justify-content:center;padding:0}
.modal.on{display:flex}
@media(min-width:760px){.modal{align-items:center;padding:16px}}
.modal-box{
  width:100%;max-width:720px;max-height:94vh;overflow:auto;background:#fff;
  border-radius:20px 20px 0 0;box-shadow:0 30px 80px rgba(0,0,0,.3)
}
@media(min-width:760px){.modal-box{border-radius:18px}}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff}
.modal-h h2{font-family:'Poppins',sans-serif;font-size:16px;font-weight:800}
.modal-b{padding:18px}
.formgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field.full{grid-column:1/-1}
.amenities{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.footer-gap{height:20px}
.hidden{display:none !important}
.matrix-scroll{overflow-x:auto}
.matrix-table{border-collapse:collapse;width:100%}
.matrix-table th, .matrix-table td{padding:1px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
.matrix-table th{font-size:7px;font-weight:800;color:var(--muted)}
.matrix-table tfoot th{border-top:1px solid var(--border);border-bottom:none;color:var(--subtle);font-size:7px}
.matrix-table th.weekend{background:var(--bg)}
.matrix-table th.holiday-col{color:#EA580C;font-weight:900}
.matrix-standcol{position:sticky;left:0;background:#fff;z-index:2;font-size:8px;font-weight:800;min-width:90px;white-space:nowrap;text-align:left !important}
.matrix-table thead th.matrix-standcol{z-index:3}
.matrix-nav{display:flex;gap:8px}
.daycell{display:block;width:10px;height:10px;border-radius:2px;margin:0 auto;box-sizing:border-box;position:relative;}
.daycell.available{background:var(--ok-l);border:1px solid var(--ok)}
.daycell.reserved{background:#2563EB;border:1px solid #1D4ED8}
.daycell.booked, .daycell.maintenance{background:var(--bad);border:1px solid #B91C1C}
.daycell.past{background:var(--bg);border:1px solid var(--border);opacity:.45}
.daycell.weekend{box-shadow:inset 0 0 0 1px rgba(24,24,27,.22)}
.daycell.holiday::after{content:'';position:absolute;top:-2px;right:-2px;width:5px;height:5px;border-radius:50%;background:#F97316;border:1px solid #fff}
.matrix-legend{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:8px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.dot.available{background:var(--ok-l);border:1px solid var(--ok)}
.dot.reserved{background:#2563EB;border:1px solid #1D4ED8}
.dot.booked{background:var(--bad);border:1px solid #B91C1C}
.dot.past{background:var(--bg);border:1px solid var(--border)}
.price-breakdown-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.price-breakdown-table th{text-align:left;padding:3px 6px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border)}
.price-breakdown-table td{padding:3px 6px;border-bottom:1px solid var(--border)}
.price-breakdown-table tfoot td{font-weight:800;border-top:2px solid var(--border);border-bottom:none;padding:5px 6px}
.tier-badge{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px}
.tier-badge.peak{background:var(--bad-l);color:var(--bad)}
.tier-badge.shoulder{background:var(--warn-l);color:var(--warn)}
.tier-badge.offPeak{background:var(--ok-l);color:var(--ok)}
.tier-badge.weekend{background:#EFF6FF;color:#1D4ED8}

/* ── Day-cell price tooltip ── */
#kkTip{
  position:fixed;z-index:9999;pointer-events:none;
  background:#18181B;color:#fff;border-radius:10px;
  padding:9px 12px;font-size:11px;font-weight:700;
  white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.28);
  opacity:0;transition:opacity .1s;transform:translateY(-100%) translateY(-6px);
}
#kkTip.on{opacity:1;}
#kkTip .tip-date{font-size:10px;color:rgba(255,255,255,.6);margin-bottom:4px;}
#kkTip .tip-price{font-size:15px;font-weight:900;letter-spacing:-.3px;}
#kkTip .tip-sub{font-size:9.5px;color:rgba(255,255,255,.55);margin-top:2px;}

/* ── Week view ── */
.matrix-toggle{display:flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0}
.mtog{height:28px;padding:0 13px;border:none;background:#fff;font-family:'Nunito',sans-serif;
  font-size:11px;font-weight:800;cursor:pointer;color:var(--muted);transition:background .13s,color .13s}
.mtog.active{background:var(--brand);color:#fff}
.week-table{border-collapse:separate;border-spacing:2px;width:100%;min-width:520px}
.week-table th{border:none;text-align:center;vertical-align:middle}
.week-table td{border:none;padding:0;text-align:center;vertical-align:middle}
.week-standcol{font-size:10px;font-weight:800;min-width:88px;max-width:110px;
  text-align:left!important;padding:4px 8px;position:sticky;left:0;background:#fff;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-dayhdr{min-width:80px;font-size:10px;font-weight:800;color:var(--muted);padding:3px 4px;line-height:1.3}
.week-dayhdr.weekend{background:var(--bg);border-radius:5px;}
.week-dayhdr.holiday-col{color:var(--brand-d)}
.week-dayhdr.today-col{background:var(--brand-l);border-radius:5px;}
.wcell{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:2px 4px;border-radius:6px;}
.wcell.available{background:var(--ok-l);cursor:default}
.wcell.reserved{background:#DBEAFE}
.wcell.booked,.wcell.maintenance{background:#FEE2E2}
.wcell.past{background:var(--bg);opacity:.45}
.wcell.today{outline:2px solid var(--brand);outline-offset:-2px;border-radius:6px;}
.w-price{font-family:'Poppins',sans-serif;font-size:11px;font-weight:800;color:#15803D;line-height:1}
.w-tier{font-size:8px;font-weight:800;border-radius:999px;padding:1px 4px}
.w-tier.peak{background:var(--bad-l);color:var(--bad)}
.w-tier.shoulder{background:var(--warn-l);color:var(--warn)}
.w-tier.offPeak{background:var(--ok-l);color:var(--ok)}
.w-tier.weekend{background:#EFF6FF;color:#1D4ED8}
.w-label{font-size:9.5px;font-weight:700;color:var(--subtle)}
.w-hol{font-size:7.5px;color:var(--brand-d);font-weight:800;margin-top:0}

/* ── Mobile portrait: tighter week view ── */
@media(max-width:600px){
  .week-table{min-width:0;border-spacing:1px;}
  .week-standcol{min-width:56px;max-width:68px;font-size:8.5px;padding:2px 4px;}
  .week-dayhdr{min-width:36px;font-size:8.5px;padding:2px 2px;line-height:1.2;}
  .wcell{height:32px;border-radius:5px;gap:0;padding:1px 2px;}
  .w-price{font-size:9.5px;}
  .w-tier{font-size:7px;padding:0 3px;}
  .w-label{font-size:8.5px;}
  .w-hol{display:none;}
  .matrix-scroll{padding-bottom:10px;}
}
/* ── Compact vertical rhythm ───────────────────────────────────── */
.topbar{min-height:46px;padding:6px 14px;}
.wrap{padding:10px 12px 40px;}
.hero{padding:13px 16px;margin-bottom:10px;}
.hero h1{font-size:20px;}
.hero p{margin-top:4px;font-size:13px;}
.card{padding:10px;margin-bottom:10px;}
.searchgrid{gap:8px;}
.field{gap:3px;}
.field label{font-size:10px;letter-spacing:.3px;}
.input,.select{height:36px;font-size:13px;padding:0 10px;}
.stepper{height:36px;padding:0 5px;}
.stepper button{width:28px;height:28px;font-size:14px;}
.stepper span{font-size:13px;}
.btn{height:36px;font-size:13px;padding:0 14px;}
.resultsHead{margin-bottom:8px;}
.resultsHead h2{font-size:16px;}
.standgrid{gap:10px;}
.standcard .thumb{height:96px;}
.standcard .body{padding:10px 12px 12px;gap:5px;}
.standcard h3{font-size:14px;}
.standcard .type{font-size:10px;}
.standcard .desc{font-size:11.5px;margin-bottom:0;}
.standcard .meta{gap:4px;}
.chip{padding:3px 7px;font-size:10.5px;}
.standcard .pricerow{padding-top:8px;}
.standcard .price{font-size:16px;}
.standcard .pricesub{font-size:10px;}
.modal-h{padding:11px 16px;}
.modal-h h2{font-size:14px;}
.modal-b{padding:13px 16px;}
.formgrid{gap:10px;}
.notice{padding:10px 13px;font-size:12.5px;}
.small{font-size:11.5px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>
<header class="topbar">
  <div class="logo">🏕️</div>
  <div class="brandname" id="resortNameTop">KampKiepie</div>
  <a href="#" id="backToResortLink" class="back-link hidden">← Back</a>
</header>
<div class="wrap" id="app">
  <div class="center" id="loadingState">
    <div class="small">Loading booking system…</div>
  </div>
</div>
<div class="modal" id="standModal" onclick="modalBackdrop(event,'standModal')">
  <div class="modal-box">
    <div class="modal-h">
      <h2 id="standModalTitle">Stand details</h2>
      <button class="btn btn-soft" onclick="closeModal('standModal')">Close</button>
    </div>
    <div class="modal-b" id="standModalBody"></div>
  </div>
</div>
<div class="modal" id="bookModal" onclick="modalBackdrop(event,'bookModal')">
  <div class="modal-box">
    <div class="modal-h">
      <h2>Request this stand</h2>
      <button class="btn btn-soft" onclick="closeModal('bookModal')">Close</button>
    </div>
    <div class="modal-b" id="bookModalBody"></div>
  </div>
</div>
<script>
// ── Supabase client ───────────────────────────────────────────────────────────
const SUPABASE_URL      = 'https://vgqxaubluvqjbvzgsvze.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZncXhhdWJsdXZxamJ2emdzdnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDI5MzEsImV4cCI6MjEwNDk3ODkzMX0.YSrWrmIREgwYXdW2l6OVbegsymxNC8yHO6uMePFTSoo';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── App state ─────────────────────────────────────────────────────────────────
const APP = {
  resortId: getQueryParam('resort') || '1',
  resort: null,
  resortActive: true,
  kkbookMode: 'live',
  onBoard: true,
  defaults: {},
  stands: [],
  standTypes: [],
  bookings: [],
  blocks: [],
  matrixMonths: [],
  matrixStands: [],
  matrixMonthIndex: 0,
  matrixView: 'month',
  matrixWeekStart: null,
  publicHolidays: [],
  holidayByDate: {},
  search: { checkIn:'', checkOut:'', adults:2, children:0, toddlers:0, standType:'' },
};

// ── Utilities ─────────────────────────────────────────────────────────────────
function getQueryParam(name){
  return new URLSearchParams(location.search).get(name) || '';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function truthy(v){ var s=String(v||'').trim().toLowerCase(); return s==='true'||s==='1'||s==='yes'; }
function displayDate(v){ var s=String(v||'').trim(); return s.includes('T')?s.slice(0,10):s; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){
  if(!dateStr) return '';
  var d=new Date(dateStr+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function parseDateOnly(str){
  if(!str) return null;
  var m=String(str).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null;
}
function monthLabel(mk){
  if(!mk) return '';
  var d=new Date(mk+'-01T00:00:00Z');
  return d.toLocaleDateString('en-ZA',{month:'long',year:'numeric',timeZone:'UTC'});
}
function isWeekendDay(dateStr){
  var d=parseDateOnly(dateStr); if(!d) return false;
  return d.getUTCDay()===0||d.getUTCDay()===6;
}
function overlap(s1,e1,s2,e2){
  return displayDate(s1)<displayDate(e2) && displayDate(e1)>displayDate(s2);
}
function formatMoney(amount, currency){
  var n=Number(amount)||0;
  return (currency||'ZAR')+' '+n.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function currencyOf(s){ return String(s&&s.Currency||APP.defaults&&APP.defaults.DefaultCurrency||'ZAR'); }
function optionHtml(val,label,selected){ return '<option value="'+esc(val)+'"'+(selected?' selected':'')+'>'+esc(label)+'</option>'; }
function standLabel(s){ return [s.StandNumber,s.StandName].filter(Boolean).join(' - '); }
function standTypeName(id){
  var t=APP.standTypes.find(function(x){ return String(x.StandTypeID)===String(id||''); });
  return t?String(t.StandTypeName||t.StandTypeID):String(id||'');
}
function activeStands(){
  return APP.stands.filter(function(s){
    return !truthy(s.SoftDeleted) && truthy(s.Active) && s.StandVisibility !== false;
  });
}
function isStandAvailable(standId, checkIn, checkOut){
  if(!checkIn||!checkOut) return true;
  var bookingConflict=APP.bookings.some(function(b){
    if(String(b.StandID||'')!==String(standId||'')) return false;
    return overlap(b.CheckInDate,b.CheckOutDate,checkIn,checkOut);
  });
  if(bookingConflict) return false;
  var blockConflict=APP.blocks.some(function(b){
    if(String(b.StandID||'')!==String(standId||'')) return false;
    return overlap(b.StartDate,b.EndDate,checkIn,checkOut);
  });
  return !blockConflict;
}
function nightsBetween(checkIn,checkOut){
  var a=parseDateOnly(checkIn),b=parseDateOnly(checkOut);
  if(!a||!b) return 0;
  return Math.max(0,Math.round((b.getTime()-a.getTime())/86400000));
}

var _KK_BUST='kkC_bust', _KK_H4=4*60*60*1000;
function kkGet(key){
  try{
    var e=JSON.parse(localStorage.getItem(key)||'null');
    if(!e||!e.v||!e.ts||!e.ttl) return null;
    if(e.bustable&&Number(localStorage.getItem(_KK_BUST)||0)>e.ts) return null;
    if(Date.now()-e.ts>e.ttl) return null;
    return e.v;
  }catch(_){return null;}
}
function kkSet(key,val,ttlMs,bustable){
  try{ localStorage.setItem(key,JSON.stringify({v:val,ts:Date.now(),ttl:ttlMs,bustable:!!bustable})); }catch(_){}
}

function applyBranding(){

  document.documentElement.style.setProperty('--brand',corp);
  document.documentElement.style.setProperty('--brand-d',shadeColour_(corp,-20));
  document.documentElement.style.setProperty('--brand-l',hexToRgba_(corp,0.08));
  document.documentElement.style.setProperty('--ok',sub);
  document.documentElement.style.setProperty('--ok-l',hexToRgba_(sub,0.08));
  var topbar=document.querySelector('.topbar');
  if(topbar) topbar.style.borderBottom='2px solid '+hexToRgba_(corp,0.25);
}
function hexToRgba_(hex,alpha){
  hex=String(hex||'').replace('#','');
  if(hex.length===3) hex=hex.split('').map(function(h){return h+h;}).join('');
  var r=parseInt(hex.substring(0,2),16);
  var g=parseInt(hex.substring(2,4),16);
  var b=parseInt(hex.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}
function shadeColour_(hex,percent){
  hex=String(hex||'').replace('#','');
  if(hex.length===3) hex=hex.split('').map(function(h){return h+h;}).join('');
  var r=Math.min(255,Math.max(0,parseInt(hex.substring(0,2),16)+percent));
  var g=Math.min(255,Math.max(0,parseInt(hex.substring(2,4),16)+percent));
  var b=Math.min(255,Math.max(0,parseInt(hex.substring(4,6),16)+percent));
  return '#'+[r,g,b].map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');
}

// ── Dynamic pricing engine ────────────────────────────────────────────────────
function classifyNight(dateStr){
  var sr=(function(){try{return JSON.parse(APP.defaults.SeasonRulesJSON||'{}');}catch(e){return{};}}());
  var peaks=sr.peak||[],shoulders=sr.shoulder||[];
  var pht=(function(){
    var s=String(APP.defaults.PreHolidayTreatment||'offPeak').toLowerCase().replace(/[^a-z]/g,'');
    return s==='peak'?'peak':s==='shoulder'?'shoulder':s==='weekend'?'weekend':'offPeak';
  }());
  var tomorrow=addDays(dateStr,1);
  var norm=function(v){return v?String(v).trim().slice(0,10):'';};
  var isPreHoliday=APP.publicHolidays.some(function(h){
    return norm(h.date)===tomorrow||norm(h.observedDate)===tomorrow||
           norm(h.Date)===tomorrow||norm(h.ObservedDate)===tomorrow;
  });
  if(isPreHoliday){
    if(peaks.some(function(r){return r.start&&r.end&&tomorrow>=r.start&&tomorrow<=r.end;})) return 'peak';
    if(shoulders.some(function(r){return r.start&&r.end&&tomorrow>=r.start&&tomorrow<=r.end;})) return 'shoulder';
    return pht;
  }
  if(peaks.some(function(r){return r.start&&r.end&&dateStr>=r.start&&dateStr<=r.end;})) return 'peak';
  if(shoulders.some(function(r){return r.start&&r.end&&dateStr>=r.start&&dateStr<=r.end;})) return 'shoulder';
  var d=parseDateOnly(dateStr);
  if(d&&(d.getUTCDay()===5||d.getUTCDay()===6)) return 'weekend';
  return 'offPeak';
}
function renderPriceBreakdown(est){
  if(!est||!est.breakdown) return '';
  var tc={peak:'peak',shoulder:'shoulder',offPeak:'offPeak',weekend:'weekend'};
  return '<div style="overflow:auto;margin-top:8px"><table class="price-breakdown-table"><thead><tr><th>Date</th><th>Tier</th><th>Detail</th><th style="text-align:right">Amount</th></tr></thead><tbody>'
    +est.breakdown.map(function(n){return '<tr><td>'+esc(n.date)+'</td><td><span class="tier-badge '+(tc[n.tier]||'')+'">'+esc(n.tierLabel)+'</span></td><td style="color:var(--muted)">'+esc(n.detail)+'</td><td style="text-align:right;font-weight:800">'+esc(formatMoney(n.rate,est.currency))+'</td></tr>';}).join('')
    +'</tbody><tfoot><tr><td colspan="3">Total &mdash; '+esc(est.nights)+' night'+(est.nights!==1?'s':'')+'</td><td style="text-align:right;color:var(--brand-d);font-size:13px">'+esc(formatMoney(est.total,est.currency))+'</td></tr></tfoot></table></div>';
}
function isPublicHoliday(dateStr){ return !!APP.holidayByDate[dateStr]; }
function estimateRate(stand,dateStr){
  var d=parseDateOnly(dateStr);
  var day=d?d.getUTCDay():1;
  var isWeekend=day===0||day===6;
  if((isWeekend||isPublicHoliday(dateStr))&&stand.WeekendRate) return Number(stand.WeekendRate);
  return Number(stand.BaseRate||0);
}
function estimateTotal(stand,checkIn,checkOut){
  var nightCount=nightsBetween(checkIn,checkOut);
  if(!nightCount) return {nights:0,total:0,currency:currencyOf(stand),mode:'legacy',breakdown:null};
  // Try dynamic pricing from stand type
  var st=stand.StandTypeID?APP.standTypes.find(function(t){return String(t.StandTypeID)===String(stand.StandTypeID);}):null;
  var pricingJSON=stand.PricingJSON||(st&&(st.PricingJSON||''))||'';
  if(pricingJSON&&pricingJSON!=='{}'){
    try{
      var pj=JSON.parse(pricingJSON);
      var mode=String(pj.mode||'flat').toLowerCase();
      var cur=currencyOf(stand);
      var breakdown=[],total=0;
      var TIER_LABELS={peak:'Peak',shoulder:'Shoulder',offPeak:'Off-Peak',weekend:'Weekend'};
      for(var i=0;i<nightCount;i++){
        var d=addDays(checkIn,i);
        var tier=classifyNight(d);
        var rate=0;
        if(mode==='tiered'){
          var tierKey={peak:'peakRate',shoulder:'shoulderRate',offPeak:'offPeakRate',weekend:'weekendRate'}[tier]||'offPeakRate';
          rate=Number(pj[tierKey]||pj.baseRate||stand.BaseRate||0);
        }else{
          rate=Number(pj.baseRate||stand.BaseRate||0);
        }
        breakdown.push({date:d,tier:tier,tierLabel:TIER_LABELS[tier]||tier,rate:rate,detail:formatMoney(rate,cur)+'/night'});
        total+=rate;
      }
      return {nights:nightCount,total:total,currency:cur,mode:mode,breakdown:breakdown};
    }catch(e){}
  }
  // Legacy: flat rate
  var cur2=currencyOf(stand);
  var nightlyRate=estimateRate(stand,checkIn);
  return {nights:nightCount,total:nightCount*nightlyRate,currency:cur2,mode:'legacy',breakdown:null};
}
function depositAmount(stand,total){
  var mode=String(stand.DepositMode||APP.defaults.DefaultDepositMode||'percentage').toLowerCase();
  var val=Number(stand.DepositValue!==undefined?stand.DepositValue:(APP.defaults.DefaultDepositValue||50));
  if(mode==='fixed') return val;
  return Math.round(total*(val/100)*100)/100;
}

// ── Data loading (Supabase) ───────────────────────────────────────────────────
async function loadDataInBackground(){
  var bootKey = 'kkC_boot_' + APP.resortId;
  var cached  = kkGet(bootKey);

  function applyStatic(d){
    APP.defaults      = d.defaults    || {};
    APP.stands        = d.stands      || [];
    APP.standTypes    = d.standTypes  || [];
    APP.publicHolidays = d.publicHolidays || [];
    APP.holidayByDate = {};
    APP.publicHolidays.forEach(function(h){
      var same = h.date === h.observedDate;
      if (h.date)                       APP.holidayByDate[h.date]         = same ? h.name : h.name+' (actual date)';
      if (h.observedDate && !same)      APP.holidayByDate[h.observedDate] = h.name+' (observed)';
    });
  }

  function refreshUI(){
    var stSel = document.getElementById('searchStandType');
    if (stSel) {
      var types = [...new Set(activeStands().map(function(s){ return String(s.StandTypeID||''); }).filter(Boolean))];
      stSel.innerHTML = '<option value="">All types</option>' + types.map(function(id){ return optionHtml(id, standTypeName(id)); }).join('');
      if (APP.search.standType) stSel.value = APP.search.standType;
    }
    var minNights = Number((APP.defaults && APP.defaults.DefaultMinNights) || 1);
    var coEl = document.getElementById('searchCheckOut');
    if (coEl) {
      var minOut = addDays(APP.search.checkIn, Math.max(1, minNights));
      coEl.min = minOut;
      if (displayDate(coEl.value) < minOut) { coEl.value = minOut; APP.search.checkOut = minOut; }
    }
  }

  async function fetchStatic(){
    const [defaultsR, standsR, standTypesR, holidaysR] = await Promise.all([
      sb.from('resort_defaults').select('*').eq('resort_id', APP.resortId).maybeSingle(),
      sb.from('stands').select('*').eq('resort_id', APP.resortId).eq('stand_visibility', true),
      sb.from('stand_types').select('*').eq('resort_id', APP.resortId),
      sb.from('sa_public_holidays').select('holiday_date, name').order('holiday_date'),
    ]);
    return {
      defaults:      defaultsR.data ? sbToDefaults(defaultsR.data) : {},
      stands:        (standsR.data    || []).map(sbToStand).filter(function(s){ return !s.SoftDeleted && s.Active !== false; }),
      standTypes:    (standTypesR.data || []).map(sbToStandType).filter(function(t){ return !t.SoftDeleted; }),
      publicHolidays:(holidaysR.data  || []).map(function(h){ return { date: h.holiday_date, name: h.name }; }),
    };
  }

  async function fetchAvailability(){
    const [bookingsR, blocksR] = await Promise.all([
      sb.from('bookings').select('booking_id, stand_id, resort_id, check_in_date, check_out_date, status, soft_deleted').eq('resort_id', APP.resortId).not('status', 'in', '("cancelled","no-show","completed")'),
      sb.from('calendar_blocks').select('block_id, stand_id, resort_id, start_date, end_date, block_type, soft_deleted').eq('resort_id', APP.resortId),
    ]);
    return {
      bookings: (bookingsR.data || []).map(sbToBooking).filter(function(b){ return !b.SoftDeleted; }),
      blocks:   (blocksR.data  || []).map(sbToBlock).filter(function(b){ return !b.SoftDeleted; }),
    };
  }

  try {
    if (cached) {
      applyStatic(cached);
      refreshUI();

      // Fetch availability fresh
      var avail = await fetchAvailability();
      APP.bookings = avail.bookings;
      APP.blocks   = avail.blocks;
      buildMatrix();
      renderAvailabilityMatrix();

      // Refresh static in background
      fetchStatic().then(function(fresh){
        kkSet(bootKey, fresh, _KK_H4, true);
        applyStatic(fresh);
        refreshUI();
      }).catch(function(){});

    } else {
      var [staticData, avail] = await Promise.all([fetchStatic(), fetchAvailability()]);
      kkSet(bootKey, staticData, _KK_H4, true);
      applyStatic(staticData);
      APP.bookings = avail.bookings;
      APP.blocks   = avail.blocks;
      buildMatrix();
      refreshUI();
      renderAvailabilityMatrix();
    }
  } catch(err) {
    console.warn('[KK] Background load error:', err);
    document.getElementById('matrixWrap').innerHTML = '';
  }
}

// ── Availability matrix builder ───────────────────────────────────────────────
function buildMatrix(){
  // Build matrixMonths and matrixStands from stands + bookings + blocks
  var today = todayStr();
  var startMonth = today.slice(0, 7);
  // Build 6 months ahead
  var months = [];
  var d = new Date(startMonth + '-01T00:00:00Z');
  for (var i = 0; i < 6; i++) {
    months.push(d.toISOString().slice(0, 7));
    d.setUTCMonth(d.getUTCMonth() + 1);
  }
  APP.matrixMonths = months;
  APP.matrixMonthIndex = 0;

  APP.matrixStands = activeStands().map(function(stand){
    var ms = { StandID: stand.StandID, StandNumber: stand.StandNumber, StandName: stand.StandName, StandTypeID: stand.StandTypeID, months: {} };
    months.forEach(function(mk){
      var daysInMonth = new Date(Date.UTC(+mk.slice(0,4), +mk.slice(5,7), 0)).getUTCDate();
      var days = [];
      for (var day = 1; day <= daysInMonth; day++) {
        days.push(mk + '-' + String(day).padStart(2,'0'));
      }
      var status = {};
      days.forEach(function(day){
        var booked = APP.bookings.some(function(b){ return String(b.StandID)===String(stand.StandID) && day>=displayDate(b.CheckInDate) && day<displayDate(b.CheckOutDate); });
        var blocked = APP.blocks.some(function(b){ return String(b.StandID)===String(stand.StandID) && day>=displayDate(b.StartDate) && day<displayDate(b.EndDate); });
        status[day] = booked ? 'booked' : blocked ? 'maintenance' : 'available';
      });
      ms.months[mk] = { days: days, status: status };
    });
    return ms;
  });
}

// ── Week-view helpers ─────────────────────────────────────────────────────────
function currentSunday(){
  var d=new Date(); d.setUTCDate(d.getUTCDate()-d.getUTCDay());
  return d.toISOString().slice(0,10);
}
function weekDayHdrHtml(dayStr){
  var d=new Date(dayStr+'T00:00:00Z');
  return d.toLocaleDateString('en-ZA',{weekday:'short',timeZone:'UTC'})+'<br>'+d.toLocaleDateString('en-ZA',{day:'numeric',month:'short',timeZone:'UTC'});
}
function getMatrixDayStatus(matrixStand,dayStr){
  var mk=dayStr.slice(0,7);
  var md=matrixStand.months[mk]||{status:{}};
  return (md.status&&md.status[dayStr])||'available';
}
function goToToday(){
  if(APP.matrixView==='week'){ APP.matrixWeekStart=currentSunday(); }
  else{ var mk=todayStr().slice(0,7); var idx=APP.matrixMonths.indexOf(mk); APP.matrixMonthIndex=idx>=0?idx:0; }
  renderAvailabilityMatrix();
}
function setMatrixView(view){ APP.matrixView=view; if(view==='week'&&!APP.matrixWeekStart) APP.matrixWeekStart=currentSunday(); renderAvailabilityMatrix(); }
function stepMatrixWeek(delta){ if(!APP.matrixWeekStart) APP.matrixWeekStart=currentSunday(); APP.matrixWeekStart=addDays(APP.matrixWeekStart,delta*7); renderAvailabilityMatrix(); }
function stepMatrixMonth(delta){ APP.matrixMonthIndex=Math.min(Math.max(0,APP.matrixMonthIndex+delta),APP.matrixMonths.length-1); renderAvailabilityMatrix(); }

function renderWeekRow(ms,days,today){
  var full=APP.stands.find(function(s){return String(s.StandID)===String(ms.StandID);});
  var TL={peak:'Peak',shoulder:'Shoulder',offPeak:'Off-Peak',weekend:'Weekend'};
  var cells=days.map(function(day){
    var status=getMatrixDayStatus(ms,day);
    var isPast=day<today, isToday=day===today, iWknd=isWeekendDay(day);
    var hol=APP.holidayByDate[day]||'';
    if(isPast) return '<td><div class="wcell past'+(isToday?' today':'')+'"></div></td>';
    if(status==='available'){
      var priceInner='';
      if(full){
        var est=estimateTotal(full,day,addDays(day,1));
        var cur=currencyOf(full);
        var tier=classifyNight(day);
        if(est.total>0){ priceInner='<div class="w-price">'+esc(formatMoney(est.total,cur))+'</div><div class="w-tier '+tier+'">'+esc(TL[tier]||tier)+'</div>'; }
      }
      if(hol) priceInner+='<div class="w-hol">'+esc(hol.split(' ')[0]+'…')+'</div>';
      return '<td><div class="wcell available'+(iWknd?' weekend':'')+(isToday?' today':'')+'">'+priceInner+'</div></td>';
    }
    var lbl={reserved:'Reserved',booked:'Booked',maintenance:'Maintenance'}[status]||(status.charAt(0).toUpperCase()+status.slice(1));
    return '<td><div class="wcell '+status+(isToday?' today':'')+'"><div class="w-label">'+esc(lbl)+'</div></div></td>';
  }).join('');
  return '<tr><td class="week-standcol" title="'+esc([ms.StandNumber,ms.StandName].filter(Boolean).join(' - '))+'">'+esc([ms.StandNumber,ms.StandName].filter(Boolean).join(' - '))+'</td>'+cells+'</tr>';
}

function renderAvailabilityMatrix(){
  if(!APP.matrixWeekStart) APP.matrixWeekStart=currentSunday();
  if(APP.matrixView==='week'){ renderAvailabilityMatrixWeek(); return; }
  var wrap=document.getElementById('matrixWrap'); if(!wrap) return;
  wrap.classList.remove('hidden');
  var filteredStands=APP.search.standType?APP.matrixStands.filter(function(s){return String(s.StandTypeID||'')===APP.search.standType;}):APP.matrixStands;
  if(!APP.matrixMonths.length||!filteredStands.length){ wrap.innerHTML=''; return; }
  var idx=Math.min(APP.matrixMonthIndex,APP.matrixMonths.length-1);
  var monthKey=APP.matrixMonths[idx];
  var sampleStand=filteredStands.find(function(s){return s.months[monthKey]&&s.months[monthKey].days.length;})||filteredStands[0];
  var cutoff=addDays(todayStr(),-7);
  var days=((sampleStand.months[monthKey]&&sampleStand.months[monthKey].days)||[]).filter(function(d){return d>=cutoff;});
  wrap.innerHTML='<div class="card"><div class="resultsHead"><h2 style="font-size:14px">'+esc(monthLabel(monthKey))+'</h2>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button class="btn btn-soft" onclick="goToToday()" style="height:28px;padding:0 12px;font-size:11px;font-weight:800;border-radius:8px">Today</button>'
    +'<div class="matrix-toggle"><button class="mtog active" onclick="setMatrixView(\'month\')">Month</button><button class="mtog" onclick="setMatrixView(\'week\')">Week</button></div>'
    +'<div class="matrix-nav"><button class="btn btn-soft" onclick="stepMatrixMonth(-1)" '+(idx===0?'disabled':'')+' style="height:28px;padding:0 10px;font-size:11px">\u2190 Prev</button>'
    +'<button class="btn btn-soft" onclick="stepMatrixMonth(1)" '+(idx===APP.matrixMonths.length-1?'disabled':'')+' style="height:28px;padding:0 10px;font-size:11px">Next \u2192</button></div></div></div>'
    +'<div style="overflow-x:auto"><table class="matrix-table"><thead><tr><th style="min-width:120px">Stand</th>'
    +days.map(function(d){
      var isT=d===todayStr(),isW=isWeekendDay(d),hol=APP.holidayByDate[d]||'';
      return '<th class="'+(isT?'today-col ':'')+(isW?'weekend-col ':'')+(hol?'holiday-col ':'')+'" title="'+(hol?esc(hol)+' \u00b7 ':'')+esc(d)+'">'
        +'<div>'+esc(new Date(d+'T00:00:00Z').toLocaleDateString('en-ZA',{weekday:'short',timeZone:'UTC'}))+'</div>'
        +'<div style="font-size:10px">'+esc(d.slice(8,10))+'</div></th>';
    }).join('')+'</tr></thead><tbody>'
    +filteredStands.map(function(ms){
      return '<tr><td class="matrix-standcol">'+esc([ms.StandNumber,ms.StandName].filter(Boolean).join(' - '))+'</td>'
        +days.map(function(day){
          var status=getMatrixDayStatus(ms,day);
          var isPast=day<todayStr(),isW=isWeekendDay(day),hol=APP.holidayByDate[day]||'';
          if(isPast) return '<td><span class="daycell past" title="'+esc(day)+'"></span></td>';
          return '<td><span class="daycell '+status+(isW?' weekend':'')+(hol?' holiday':'')+'" title="'+esc(day)+(hol?' \u00b7 '+esc(hol):'')+'" data-stand-id="'+esc(ms.StandID)+'" data-date="'+esc(day)+'"></span></td>';
        }).join('')+'</tr>';
    }).join('')
    +'</tbody></table></div>'
    +'<div class="matrix-legend"><span><span class="matrix-dot available"></span>Available</span><span><span class="matrix-dot booked"></span>Booked</span><span><span class="matrix-dot maintenance"></span>Maintenance</span><span><span class="matrix-dot past"></span>Past</span></div>'
    +'</div>';
}

function renderAvailabilityMatrixWeek(){
  var wrap=document.getElementById('matrixWrap'); if(!wrap) return;
  wrap.classList.remove('hidden');
  var today=todayStr();
  if(!APP.matrixWeekStart) APP.matrixWeekStart=currentSunday();
  var days=[]; for(var i=0;i<7;i++) days.push(addDays(APP.matrixWeekStart,i));
  var filteredStands=APP.search.standType?APP.matrixStands.filter(function(s){return String(s.StandTypeID||'')===APP.search.standType;}):APP.matrixStands;
  wrap.innerHTML='<div class="card"><div class="resultsHead"><h2 style="font-size:14px">Week of '+esc(days[0])+'</h2>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button class="btn btn-soft" onclick="goToToday()" style="height:28px;padding:0 12px;font-size:11px;font-weight:800;border-radius:8px">Today</button>'
    +'<div class="matrix-toggle"><button class="mtog" onclick="setMatrixView(\'month\')">Month</button><button class="mtog active" onclick="setMatrixView(\'week\')">Week</button></div>'
    +'<div class="matrix-nav"><button class="btn btn-soft" onclick="stepMatrixWeek(-1)" style="height:28px;padding:0 10px;font-size:11px">\u2190 Prev</button>'
    +'<button class="btn btn-soft" onclick="stepMatrixWeek(1)" style="height:28px;padding:0 10px;font-size:11px">Next \u2192</button></div></div></div>'
    +'<div style="overflow-x:auto"><table class="week-table"><thead><tr><th class="week-standcol">Stand</th>'
    +days.map(function(d){ return '<th class="'+(d===today?'today-col ':'')+'">'+(APP.holidayByDate[d]?'<span title="'+esc(APP.holidayByDate[d])+'" style="color:var(--brand-d)">\u2605 </span>':'')+weekDayHdrHtml(d)+'</th>'; }).join('')
    +'</tr></thead><tbody>'
    +filteredStands.map(function(ms){ return renderWeekRow(ms,days,today); }).join('')
    +'</tbody></table></div></div>';
}

// ── Search ────────────────────────────────────────────────────────────────────
function stepSearch(field,delta){
  var min={adults:1,children:0,toddlers:0}[field]||0;
  APP.search[field]=Math.max(min,(APP.search[field]||0)+delta);
  var el=document.getElementById('search'+field.charAt(0).toUpperCase()+field.slice(1)+'Label');
  if(el) el.textContent=APP.search[field];
  saveSearchState();
}
function runSearchFresh(){
  APP.search.checkIn=document.getElementById('searchCheckIn')?.value||APP.search.checkIn;
  APP.search.checkOut=document.getElementById('searchCheckOut')?.value||APP.search.checkOut;
  APP.search.standType=document.getElementById('searchStandType')?.value||'';
  saveSearchState(); runSearch();
}
function runSearch(){
  if(!APP.search.checkIn||!APP.search.checkOut){
    document.getElementById('resultsWrap').innerHTML='<div class="notice warn">Please select check-in and check-out dates.</div>'; return;
  }
  var checkIn=APP.search.checkIn, checkOut=APP.search.checkOut;
  var nights=nightsBetween(checkIn,checkOut);
  if(nights<1){
    document.getElementById('resultsWrap').innerHTML='<div class="notice warn">Check-out must be after check-in.</div>'; return;
  }
  var minNights=Number((APP.defaults&&APP.defaults.DefaultMinNights)||1);
  if(nights<minNights){
    document.getElementById('resultsWrap').innerHTML='<div class="notice warn">Minimum stay is '+minNights+' night'+(minNights!==1?'s':'')+'.</div>'; return;
  }
  var candidates=activeStands().filter(function(s){
    if(APP.search.standType&&String(s.StandTypeID||'')!==APP.search.standType) return false;
    if(APP.search.adults&&s.MaxAdults&&Number(s.MaxAdults)<Number(APP.search.adults)) return false;
    return isStandAvailable(s.StandID,checkIn,checkOut);
  });
  renderResults(candidates, checkIn, checkOut);
}
function renderResults(stands, checkIn, checkOut){
  var rw=document.getElementById('resultsWrap');
  if(!stands.length){
    rw.innerHTML='<div class="card center"><div class="notice warn" style="width:100%">No stands available for the selected dates.</div><div class="small">Try different dates or a different accommodation type.</div></div>'; return;
  }
  var nights=nightsBetween(checkIn,checkOut);
  rw.innerHTML='<div class="resultsHead"><h2>'+stands.length+' stand'+(stands.length!==1?'s':'')+' available</h2>'
    +'<span class="pill">'+esc(displayDate(checkIn))+' \u2192 '+esc(displayDate(checkOut))+' \u00b7 '+nights+' night'+(nights!==1?'s':'')+'</span></div>'
    +'<div class="standgrid">'+stands.map(function(s){ return renderStandCard(s, checkIn, checkOut); }).join('')+'</div>';
}
function renderStandCard(s, checkIn, checkOut){
  var est=estimateTotal(s,checkIn,checkOut);
  var cur=currencyOf(s);
  var typeName=standTypeName(s.StandTypeID);
  var amenities=[];
  try{ amenities=JSON.parse(s.AmenitiesJSON||'[]'); if(!Array.isArray(amenities)) amenities=[]; }catch(e){ amenities=[]; }
  var imgHtml=s.StandImageURL
    ?'<img src="'+esc(s.StandImageURL)+'" style="width:100%;height:120px;object-fit:cover" alt="'+esc(standLabel(s))+'" onerror="this.parentNode.innerHTML=\'&#127957;&#65039;\'">'
    :'&#127957;&#65039;';
  return '<div class="standcard" onclick="openBookModal(\''+esc(s.StandID)+'\')">'
    +'<div class="thumb">'+imgHtml+'</div>'
    +'<div class="body"><h3>'+esc(standLabel(s))+'</h3>'
    +'<div class="type">'+esc(typeName)+'</div>'
    +(s.Description?'<div class="desc">'+esc(s.Description)+'</div>':'')
    +(amenities.length?'<div class="meta">'+amenities.slice(0,4).map(function(a){return '<span class="chip">'+esc(a)+'</span>';}).join('')+(amenities.length>4?'<span class="chip">+'+( amenities.length-4)+' more</span>':'')+'</div>':'')
    +'<div class="pricerow"><div><div class="price">'+esc(formatMoney(est.total,cur))+'</div><div class="pricesub">for '+est.nights+' night'+(est.nights!==1?'s':'')+'</div></div>'
    +'<button class="btn btn-brand" onclick="event.stopPropagation();openBookModal(\''+esc(s.StandID)+'\')">Book</button></div></div></div>';
}

// ── Booking modal ─────────────────────────────────────────────────────────────
function openBookModal(standId){
  var s=APP.stands.find(function(x){return x.StandID===standId;});
  if(!s) return;
  if(!APP.search.checkIn||!APP.search.checkOut){
    alert('Please select your check-in and check-out dates first.'); return;
  }
  var est=estimateTotal(s,APP.search.checkIn,APP.search.checkOut);
  var currency=currencyOf(s);
  var deposit=depositAmount(s,est.total);
  document.getElementById('bookModalBody').innerHTML=
    '<div class="notice info">'+esc(standLabel(s))+' \u00b7 '+esc(displayDate(APP.search.checkIn))+' \u2192 '+esc(displayDate(APP.search.checkOut))+' \u00b7 '+esc(est.nights)+' night'+(est.nights===1?'':'s')+'</div>'
    +'<div class="formgrid" style="margin-top:14px">'
    +'<div class="field"><label>First name</label><input class="input" id="bfFirstName"></div>'
    +'<div class="field"><label>Last name</label><input class="input" id="bfLastName"></div>'
    +'<div class="field"><label>Email</label><input class="input" type="email" id="bfEmail"></div>'
    +'<div class="field"><label>Phone</label><input class="input" id="bfPhone"></div>'
    +'<div class="field full"><label>Notes for the resort (optional)</label><input class="input" id="bfNotes" placeholder="Arrival time, special requests, etc."></div>'
    +'</div>'
    +'<div class="card" style="margin-top:16px;box-shadow:none;border:1.5px solid var(--border)">'
    +'<div class="small">Estimated total</div>'
    +'<div style="font-family:\'Poppins\',sans-serif;font-size:20px;font-weight:800;color:var(--brand-d)">'+esc(formatMoney(est.total,currency))+'</div>'
    +(est.breakdown?renderPriceBreakdown(est):'')
    +'<div class="small" style="margin-top:4px">Estimated deposit: '+esc(formatMoney(deposit,currency))+'. This is a request to reserve a booking — the resort will confirm booking and payment arrangements.</div>'
    +'</div>'
    +'<div id="bookFormMsg" style="margin-top:12px"></div>'
    +(!APP.onBoard?'<div style="background:#FEF3C7;color:#92400E;font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;">\u26a0 Sandbox Mode &mdash; booking may not be processed</div>':APP.kkbookMode==='indirect'?'<div style="background:#EFF6FF;color:#1E40AF;font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;">\uD83D\uDCE8 Enquiry &mdash; the resort will contact you to confirm in their own system</div>':'')
    +'<button class="btn btn-brand btn-block" id="sendBookingBtn" style="margin-top:12px" onclick="submitBooking(\''+esc(standId)+'\')">'+(APP.kkbookMode==='indirect'?'Send Enquiry':'Send booking request')+'</button>';
  openModal('bookModal');
}

async function submitBooking(standId){
  var s=APP.stands.find(function(x){return x.StandID===standId;}); if(!s) return;
  var firstName=document.getElementById('bfFirstName').value.trim();
  var lastName=document.getElementById('bfLastName').value.trim();
  var email=document.getElementById('bfEmail').value.trim();
  var phone=document.getElementById('bfPhone').value.trim();
  var notes=document.getElementById('bfNotes').value.trim();
  var msg=document.getElementById('bookFormMsg');
  var sendBtn=document.getElementById('sendBookingBtn');
  if(!firstName||!email){ msg.innerHTML='<div class="notice warn">Please enter at least your first name and email.</div>'; return; }
  var est=estimateTotal(s,APP.search.checkIn,APP.search.checkOut);
  var deposit=depositAmount(s,est.total);
  msg.innerHTML='<div class="notice info">Sending your request\u2026</div>';
  if(sendBtn) sendBtn.style.display='none';
  try{
    // Generate a booking reference
    var bookingRef='KK-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
    var guestFullName=(firstName+' '+lastName).trim();
    var nights=nightsBetween(APP.search.checkIn,APP.search.checkOut);
    var holdMinutes=Number(s.HoldMinutes||APP.defaults.DefaultHoldMinutes||120);
    var holdExpiresAt=new Date(Date.now()+holdMinutes*60*1000).toISOString();
    var isStaff=(function(){ try{return localStorage.getItem('kkIsResortStaff')==='true';}catch(e){return false;} })();

    const { data: newBooking, error } = await sb.from('bookings').insert({
      booking_id:                  'BK-'+Date.now()+'-'+Math.random().toString(36).slice(2,5).toUpperCase(),
      resort_id:                   APP.resortId,
      stand_id:                    standId,
      stand_type_id:               s.StandTypeID || null,
      booking_ref:                 bookingRef,
      guest_first_name:            firstName,
      guest_last_name:             lastName,
      guest_full_name:             guestFullName,
      guest_email:                 email,
      guest_phone:                 phone,
      adults:                      Number(APP.search.adults)||1,
      children:                    Number(APP.search.children)||0,
      toddlers:                    Number(APP.search.toddlers)||0,
      check_in_date:               APP.search.checkIn,
      check_out_date:              APP.search.checkOut,
      nights:                      nights,
      status:                      'reserved',
      source:                      isStaff?'admin':'website',
      booking_channel:             isStaff?'admin':'website',
      guest_notes:                 notes,
      internal_notes:              '',
      total_snapshot:              est.total,
      deposit_required_snapshot:   deposit,
      deposit_paid_snapshot:       0,
      balance_snapshot:            est.total,
      currency:                    currencyOf(s),
      pricing_snapshot_json:       JSON.stringify({nights:est.nights,total:est.total,currency:est.currency,mode:est.mode,breakdown:est.breakdown||[]}),
      hold_expires_at:             holdExpiresAt,
      soft_deleted:                false,
      created_at:                  new Date().toISOString(),
      updated_at:                  new Date().toISOString(),
    }).select().maybeSingle();

    if(error) throw new Error(error.message);

    var holdMins=holdMinutes;
    var holdTime=holdMins>=60?Math.round(holdMins/60)+(Math.round(holdMins/60)===1?' hour':' hours'):holdMins+(holdMins===1?' minute':' minutes');
    var holdNote=holdMins?'Your stand is held for about '+holdTime+' while the resort reviews your request.':'The resort will review your request shortly.';

    document.getElementById('bookModalBody').innerHTML=
      '<div class="notice ok">Request sent! Reference <strong>'+esc(bookingRef)+'</strong></div>'
      +'<p class="small" style="margin-top:12px">'+(APP.kkbookMode==='indirect'?'Your enquiry has been received. The resort will review it and contact you directly to confirm and finalise the booking in their own system.':holdNote+' You\'ll hear from the resort at '+esc(email)+(phone?' or '+esc(phone):'')+' to confirm and arrange your deposit.')+'</p>'
      +(APP.kkbookMode==='indirect'?'<p class="small" style="margin-top:8px;color:#92400E;background:#FEF3C7;padding:8px 12px;border-radius:8px;">\uD83D\uDCE8 <strong>Indirect Booking:</strong> The resort manages this booking in their own system. KampKiepie has forwarded your request.</p>':'')
      +'<button class="btn btn-soft btn-block" style="margin-top:14px" onclick="closeBookingModalAndReset()">Close</button>';

    // Refresh availability from Supabase
    try{
      const [bookingsR, blocksR] = await Promise.all([
        sb.from('bookings').select('booking_id,stand_id,resort_id,check_in_date,check_out_date,status,soft_deleted').eq('resort_id',APP.resortId).not('status','in','("cancelled","no-show","completed")'),
        sb.from('calendar_blocks').select('block_id,stand_id,resort_id,start_date,end_date,block_type,soft_deleted').eq('resort_id',APP.resortId),
      ]);
      APP.bookings=(bookingsR.data||[]).map(sbToBooking).filter(function(b){return !b.SoftDeleted;});
      APP.blocks=(blocksR.data||[]).map(sbToBlock).filter(function(b){return !b.SoftDeleted;});
      buildMatrix();
      runSearch();
    }catch(e){}

  }catch(err){
    msg.innerHTML='<div class="notice bad">'+esc(err.message||String(err))+'</div>';
    if(sendBtn) sendBtn.style.display='';
  }
}

function closeBookingModalAndReset(){
  closeModal('bookModal');
}

// ── Day-cell price tooltip ────────────────────────────────────────────────────
(function(){
  var tip=document.createElement('div'); tip.id='kkTip'; document.body.appendChild(tip);
  var TIER_COLORS={peak:'#DC2626',shoulder:'#D97706',offPeak:'#16A34A',weekend:'#2563EB'};
  var TIER_LABELS={peak:'Peak',shoulder:'Shoulder',offPeak:'Off-Peak',weekend:'Weekend'};
  function showTip(cell){
    var standId=cell.dataset.standId, date=cell.dataset.date;
    if(!standId||!date) return;
    if(!cell.classList.contains('available')) return;
    var stand=APP.stands.find(function(s){return String(s.StandID)===String(standId);});
    if(!stand) return;
    var est=estimateTotal(stand,date,addDays(date,1));
    var currency=currencyOf(stand);
    var tier=classifyNight(date);
    var color=TIER_COLORS[tier]||'#6B7280';
    var label=TIER_LABELS[tier]||tier;
    var dateFmt=new Date(date+'T00:00:00Z').toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
    var priceHtml=est.total>0?'<div class="tip-price">'+esc(formatMoney(est.total,currency))+'</div><div class="tip-sub">per night</div>':'<div class="tip-sub" style="color:rgba(255,255,255,.5)">Rate not set</div>';
    tip.innerHTML='<div class="tip-date">'+esc(dateFmt)+'</div><div style="margin-bottom:4px"><span style="background:'+color+'33;color:'+color+';font-size:9px;font-weight:800;border-radius:999px;padding:1px 7px">'+esc(label)+'</span></div>'+priceHtml;
    var r=cell.getBoundingClientRect();
    tip.style.left='0px'; tip.style.top='0px'; tip.classList.add('on');
    var tw=tip.offsetWidth;
    var left=r.left+r.width/2-tw/2;
    var top=r.top-10;
    left=Math.max(8,Math.min(left,window.innerWidth-tw-8));
    if(top<8) top=r.bottom+8;
    tip.style.left=left+'px'; tip.style.top=top+'px';
  }
  document.addEventListener('mouseover',function(e){ var cell=e.target.closest('.daycell'); if(!cell){tip.classList.remove('on');return;} showTip(cell); });
  document.addEventListener('mouseout',function(e){ if(e.target.closest('.daycell')) tip.classList.remove('on'); });
  document.addEventListener('scroll',function(){ tip.classList.remove('on'); },{passive:true});
})();

// ── Add Supabase CDN and init ─────────────────────────────────────────────────
boot();

</script>
