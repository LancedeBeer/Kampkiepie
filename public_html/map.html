<style>

  --orange:#F97316; --orange-d:#EA580C; --orange-l:#FFF7ED;

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden;

.topbar-logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.topbar-logo-icon{width:40px;height:40px;border-radius:11px;background:var(--orange);
  display:flex;align-items:center;justify-content:center;font-size:20px;}
.topbar-logo-text{font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;color:var(--green);}
.topbar-logo-text em{font-style:normal;color:var(--orange);}
.topbar-nav{display:flex;gap:26px;flex:1;}
.topbar-nav a{font-size:14.5px;font-weight:700;color:var(--green);text-decoration:none;}
.topbar-nav a:hover{color:var(--orange);}
.topbar-nav a.current{color:var(--orange);border-bottom:2px solid var(--orange);padding-bottom:3px;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.pill-count{background:var(--orange);color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:8px 16px;white-space:nowrap;}
.pill-admin{display:flex;align-items:center;gap:6px;background:var(--green);color:#fff;font-size:13px;font-weight:800;
  border-radius:999px;padding:8px 16px;text-decoration:none;white-space:nowrap;}
@media(max-width:900px){.topbar-nav{display:none;}}
@media(max-width:640px){
  .topbar{padding:10px 14px;gap:8px;position:relative;}
  .topbar-logo-icon{width:32px;height:32px;font-size:16px;border-radius:9px;}
  .topbar-logo-text{font-size:15px;}
  .pill-count{font-size:10.5px;padding:6px 10px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;}
  .topbar-right{margin-left:auto;}
  .pill-admin{padding:8px;border-radius:50%;}
  .pill-admin-label{display:none;}
}

.map-page-head{padding:20px 32px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;flex-shrink:0;}
.map-page-title{font-weight:800;font-size:20px;color:var(--green);}
.map-page-sub{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px;}
.map-search{display:flex;gap:8px;align-items:center;}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const SHEET_RESORT = 'https://docs.google.com/spreadsheets/d/1EHm0tWSyunnYpQTfTXx1-Iu4sfWaFWQ8KOrpnqId99c/gviz/tq?tqx=out:csv&sheet=Resorts';
let map, markers = [];

window.addEventListener('DOMContentLoaded', async () => {
  map = L.map('map', { minZoom: 4 });
  map.fitBounds([[-33.42, 17], [-17.42, 31]]);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'
  }).addTo(map);
  try {
    await loadResorts();
  } catch (e) {
    document.getElementById('mapSub').textContent = 'Could not load resort locations: ' + e.message;
  }
});

async function fetchCsv(url) {
  const bustUrl = url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now();
  const res = await fetch(bustUrl, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.text();
}
function parseCsv(text) {
  const rows = []; let row = []; let cur = ''; let inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else { inQ = false; } }
      else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(cur); cur = ''; rows.push(row); row = []; }
      else cur += c;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function truthy(v) { if (!v) return false; const s = String(v).trim().toLowerCase(); return s === 'true' || s === '1' || s === 'yes'; }
function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function isValidLatLng(str) {
  if (!str) return false;
  return /^-?\d{1,3}(\.\d+)?\s*,\s*-?\d{1,3}(\.\d+)?$/.test(String(str).trim());
}

async function loadResorts() {
  const csv = await fetchCsv(SHEET_RESORT);
  const rows = parseCsv(csv);
  const headers = rows[0].map(h => (h || '').trim());
  const col = name => headers.indexOf(name);
  const iName = col('Resort- Header/ResortName'), iActive = col('Resorts - Switches/BetaActive?'),
    iResortID = col('ResortID'), iMapCoords = col('Map/Coordinates'),
    iCity = col('Resort- Header/CityRowID'), iAddress = col('Resort- Header/Address');

  if (iMapCoords < 0) {
    document.getElementById('mapSub').textContent = 'The Map/Coordinates column could not be found in the sheet.';
    return;
  }

  let plotted = 0, totalActive = 0;
  rows.slice(1).forEach(row => {
    const name = (row[iName] || '').trim();
    if (!name) return;
    const active = truthy(row[iActive]);
    if (active) totalActive++;
    if (!active) return;
    const coords = (row[iMapCoords] || '').trim();
    if (!isValidLatLng(coords)) return;
    const [latStr, lngStr] = coords.split(',').map(s => s.trim());
    const lat = parseFloat(latStr), lng = parseFloat(lngStr);
    if (isNaN(lat) || isNaN(lng)) return;
    const resortId = (row[iResortID] || '').trim();
    const address = (row[iAddress] || '').trim();

    const marker = L.marker([lat, lng]).addTo(map);
    marker.bindPopup(
      '<div class="map-popup-name">' + esc(name) + '</div>' +
      (address ? '<div class="map-popup-loc">📍 ' + esc(address) + '</div>' : '') +
      '<a class="map-popup-link" href="resort.html?id=' + encodeURIComponent(resortId) + '" target="_blank">View Resort →</a>'
    );
    marker._resortName = name.toLowerCase();
    markers.push(marker);
    plotted++;
  });

  document.getElementById('resortCountPill').textContent = totalActive + ' resorts';
  document.getElementById('mapSub').textContent = plotted + ' of ' + totalActive + ' resorts shown on the map';
}

function filterMapMarkers(query) {
  const q = query.trim().toLowerCase();
  markers.forEach(m => {
    const match = !q || m._resortName.includes(q);
    if (match) { if (!map.hasLayer(m)) m.addTo(map); }
    else { if (map.hasLayer(m)) map.removeLayer(m); }
  });
}
</script>
