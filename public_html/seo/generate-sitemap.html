<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">	
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KampKiepie &#8211; Sitemap Generator</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#F4F4F6;color:#18181B;margin:0;padding:40px 20px;min-height:100vh;}
.card{background:#fff;border-radius:14px;padding:32px;max-width:560px;margin:0 auto;box-shadow:0 4px 18px rgba(0,0,0,.08);}
h1{font-size:20px;margin-bottom:6px;color:#173B2C;}
p{font-size:13px;color:#6B7280;margin-bottom:24px;line-height:1.6;}
label{font-size:13px;font-weight:700;display:block;margin-bottom:6px;}
input,select{width:100%;padding:10px 12px;border:1.5px solid #E7E2D6;border-radius:9px;
  font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:16px;}
input:focus{border-color:#F97316;}
.btn{width:100%;height:46px;background:#173B2C;color:#fff;border:none;border-radius:10px;
  font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn:hover{background:#0F2B20;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;display:none;}
.msg.ok{background:#F0FDF4;color:#166534;border:1px solid #86EFAC;}
.msg.err{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;}
.note{font-size:11.5px;color:#9CA3AF;margin-top:20px;line-height:1.6;text-align:center;}
</style>
</head>
<body>
<div class="card">
  <h1>&#128506;&#65039; Resort Sitemap Generator</h1>
  <p>Reads all active resort IDs from the Resort Info sheet and downloads
  <strong>sitemap-resorts.xml</strong>. Upload this file to your
  <code>/NewKiepie/</code> folder after downloading.</p>

  <label>Booking Backend URL (from config.txt &#8594; adminbackend_script)</label>
  <input type="url" id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec">

  <label>Site base URL</label>
  <input type="url" id="siteBase" value="https://kampkiepie.co.za/NewKiepie">

  <button class="btn" id="genBtn" onclick="generate()">
    &#8659; Generate &amp; Download sitemap-resorts.xml
  </button>

  <div class="msg" id="msg"></div>

  <div class="note">
    Once you move to the live folder, change the Site base URL to
    <code>https://kampkiepie.co.za</code> and regenerate.
  </div>
</div>

<script>
// Auto-load the API URL from config.txt
window.addEventListener('DOMContentLoaded', function() {
  fetch('config.txt', { cache: 'no-store' })
    .then(function(r){ return r.text(); })
    .then(function(text){
      var line = text.split('\n').find(function(l){ return l.trim().startsWith('adminbackend_script'); });
      if (line) {
        var url = line.split('=').slice(1).join('=').trim();
        if (url) document.getElementById('apiUrl').value = url;
      }
    }).catch(function(){});
});

async function generate() {
  var apiUrl   = document.getElementById('apiUrl').value.trim();
  var siteBase = document.getElementById('siteBase').value.trim();
  var btn      = document.getElementById('genBtn');
  var msg      = document.getElementById('msg');

  if (!apiUrl)   { showMsg('Please enter the Backend URL.', false); return; }
  if (!siteBase) { showMsg('Please enter the Site base URL.', false); return; }

  btn.disabled = true;
  btn.textContent = 'Generating\u2026';
  msg.style.display = 'none';

  try {
    var url = new URL(apiUrl);
    url.searchParams.set('action',   'generateSitemap');
    url.searchParams.set('siteBase', siteBase);
    url.searchParams.set('_ts',      Date.now());

    var res  = await fetch(url.toString(), { cache: 'no-store' });
    var data = await res.json();

    if (!data.success) throw new Error(data.error || 'Unknown error from server');

    // Trigger download
    var blob = new Blob([data.xml], { type: 'application/xml' });
    var a    = document.createElement('a');
    a.href   = URL.createObjectURL(blob);
    a.download = 'sitemap-resorts.xml';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    showMsg('\u2705 Downloaded sitemap-resorts.xml with ' + data.count +
            ' resort URLs (generated ' + data.date + '). Upload it to your /NewKiepie/ folder.', true);
  } catch(err) {
    showMsg('\u274C ' + (err.message || err), false);
  } finally {
    btn.disabled = false;
    btn.textContent = '\u2193 Generate & Download sitemap-resorts.xml';
  }
}

function showMsg(text, ok) {
  var el = document.getElementById('msg');
  el.textContent   = text;
  el.className     = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
}
</script>
</body>
</html>
