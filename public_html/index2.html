<style>
:root {
  --orange:#F97316; --orange-l:#FFF7ED; --orange-d:#EA580C;
  --green:#16A34A;  --green-l:#F0FDF4;
  --indigo:#6366F1;
  --bg:#F4F4F6; --card:#FFFFFF; --text:#18181B;
  --muted:#6B7280; --subtle:#9CA3AF; --border:#E4E4E7;
  --r:14px; --r-sm:8px;
  --sh: 0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.06);
  --sh-h: 0 4px 8px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.12);
  --hh:58px; --nh:44px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.hdr{position:fixed;inset:0 0 auto 0;height:var(--hh);background:#fff;z-index:200;
  display:flex;align-items:center;padding:0 14px;gap:10px;
  border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--border);
  will-change:transform;-webkit-transform:translateZ(0);transform:translateZ(0);}
.hdr-logo{width:34px;height:34px;border-radius:9px;background:var(--orange);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.hdr-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.4px;}
.hdr-title em{color:var(--orange);font-style:normal;}
.hdr-pill{background:var(--orange-l);color:var(--orange-d);
  font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.controls{position:fixed;left:0;right:0;z-index:190;background:#fff;
  border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04);
  will-change:transform;-webkit-transform:translateZ(0);transform:translateZ(0);}
.search-row{display:flex;gap:7px;align-items:center;padding:9px 12px 0;}
.sw{position:relative;flex:1 1 0;min-width:0;}
.sw-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--subtle);font-size:14px;pointer-events:none;}
.sinput{width:100%;height:40px;border:1.5px solid var(--border);border-radius:10px;
  padding:0 30px 0 32px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;
  color:var(--text);background:var(--bg);outline:none;transition:border-color .18s;}
.sinput::placeholder{color:var(--subtle);font-weight:600;}
.sinput:focus{border-color:var(--orange);background:#fff;}
.sx{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  background:var(--subtle);color:#fff;border:none;border-radius:50%;
  width:17px;height:17px;font-size:9px;cursor:pointer;
  display:none;align-items:center;justify-content:center;}
.sx.show{display:flex;}
.psel{height:40px;border:1.5px solid var(--border);border-radius:10px;
  padding:0 8px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;
  color:var(--text);background:var(--bg);outline:none;cursor:pointer;
  transition:border-color .18s;flex-shrink:0;max-width:145px;}
.psel:focus{border-color:var(--orange);}
.clr{height:40px;padding:0 12px;border:none;border-radius:10px;
  background:var(--orange);color:#fff;font-family:'Nunito',sans-serif;
  font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;
  transition:background .15s;flex-shrink:0;}
.clr:hover{background:var(--orange-d);}
.chips{padding:8px 12px;}
.chips-in{display:flex;flex-wrap:wrap;gap:5px;}
.chip{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;
  border-radius:16px;border:1.5px solid var(--border);background:var(--bg);
  font-family:'Nunito',sans-serif;font-size:10.5px;font-weight:700;color:var(--muted);
  cursor:pointer;transition:all .15s;user-select:none;white-space:nowrap;}
.chip svg{width:13px;height:13px;flex-shrink:0;}
.chip:hover{border-color:var(--orange);color:var(--orange);}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff;}
.chip-viewall{margin-left:auto;color:var(--orange);border-color:var(--orange);background:#fff;font-weight:800;}
.chip-viewall:hover{background:var(--orange-l);}
.main{padding:12px 12px 80px;}
@media(min-width:900px){.main{padding-left:20px;padding-right:20px;}}
.grid{display:grid;grid-template-columns:1fr;gap:13px;}
@media(min-width:500px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1140px){.grid{grid-template-columns:repeat(4,1fr);}}
.clogo-wrap{position:absolute;top:9px;right:9px;max-width:80px;max-height:60px;
  border-radius:12px;border:2px solid rgba(255,255,255,0.9);overflow:hidden;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.25);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;}
.clogo-wrap img{width:auto;height:auto;max-width:80px;max-height:60px;object-fit:contain;display:block;}
.clogo-wrap .clogo-ph{width:100%;height:100%;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:18px;}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;cursor:pointer;position:relative;
  transition:transform .2s ease,box-shadow .2s ease,opacity .5s ease;animation:none;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-h);}
.card.reveal-pending{opacity:0;transform:translateY(16px);}
.card.reveal-in{opacity:1;transform:translateY(0);}
.cimg{width:100%;height:158px;object-fit:cover;display:block;background:linear-gradient(135deg,#FFF7ED 0%,#FDE68A 100%);}
.cph{width:100%;height:158px;background:linear-gradient(135deg,#FFF7ED 0%,#FDE68A 100%);
  display:flex;align-items:center;justify-content:center;font-size:46px;}
.cbadges{position:absolute;top:9px;left:9px;display:flex;gap:4px;flex-wrap:wrap;}
.bdg{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.bdg-b{background:rgba(22,163,74,.88);color:#fff;}
.bdg-pet{background:rgba(99,102,241,.88);color:#fff;}
.cbody{padding:11px 13px 13px;display:flex;flex-direction:column;flex:1;}
.cname{font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px;line-height:1.3;margin-bottom:3px;color:var(--text);}
.cloc{font-size:11.5px;font-weight:700;color:var(--orange);margin-bottom:7px;display:flex;align-items:center;gap:3px;}
.cdesc{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.5;margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ctags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px;}
.ctag{padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:800;background:var(--orange-l);color:var(--orange-d);}
.cacts{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--border);margin-top:auto;}
.cact{flex:1;height:32px;border-radius:var(--r-sm);border:none;font-family:'Nunito',sans-serif;
  font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:3px;text-decoration:none;transition:background .13s,opacity .13s;}
.cact:hover{opacity:.88;}
.ag{background:var(--green);color:#fff;}
.ao{background:var(--orange);color:#fff;}
.as{background:var(--bg);color:var(--text);border:1.5px solid var(--border);}
.loading{text-align:center;padding:70px 20px;color:var(--muted);font-weight:700;font-size:14px;}
.chicken-stage{width:100%;height:112px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;margin-bottom:8px}
.chicken-svg{width:130px;height:auto}
.chicken-waddle{transform-box:fill-box;transform-origin:center;animation:chicken-waddle 2.2s ease-in-out infinite}
.chicken-leg{transform-box:fill-box;transform-origin:top center}
.chicken-leg-left{animation:leg-step-left .45s ease-in-out infinite}
.chicken-leg-right{animation:leg-step-right .45s ease-in-out infinite}
.chicken-head{transform-box:fill-box;transform-origin:bottom center;animation:chicken-peck 1.5s ease-in-out infinite}
.chicken-wing{transform-box:fill-box;transform-origin:top center;animation:wing-flap .5s ease-in-out infinite}
.chicken-tail{transform-box:fill-box;transform-origin:right center;animation:tail-wag .9s ease-in-out infinite}
.chicken-shadow{fill:rgba(24,24,27,.12);transform-box:fill-box;transform-origin:center;animation:shadow-pulse 2.2s ease-in-out infinite}
@keyframes chicken-waddle{0%,100%{transform:translateX(-16px) translateY(0) rotate(-4deg)}50%{transform:translateX(16px) translateY(-4px) rotate(4deg)}}
@keyframes leg-step-left{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes leg-step-right{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes chicken-peck{0%,75%,100%{transform:rotate(0deg)}88%{transform:rotate(20deg)}}
@keyframes wing-flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
@keyframes tail-wag{0%,100%{transform:rotate(0deg)}50%{transform:rotate(8deg)}}
@keyframes shadow-pulse{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--orange);
  border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:70px 20px;color:var(--muted);}
.empty-ico{font-size:52px;margin-bottom:14px;}
.empty-t{font-family:'Poppins',sans-serif;font-size:19px;font-weight:700;color:var(--text);margin-bottom:6px;}
.err-box{background:#FEF2F2;border:1.5px solid #FECACA;border-radius:12px;
  padding:16px 20px;margin:20px;font-size:14px;font-weight:600;color:#B91C1C;text-align:center;}
/* ── Header right wrapper — always pushes pill+admin to far right ── */
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;}
/* ── Header nav icons: landscape phone only, hidden by default ── */
#hdr-nav{display:none;align-items:center;gap:0;}
.hnav{display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:7px;font-size:17px;
  text-decoration:none;color:var(--subtle);transition:color .13s;position:relative;flex-shrink:0;}
.hnav.on,.hnav:hover{color:var(--orange);}
.hfbadge{position:absolute;top:2px;right:1px;background:var(--orange);color:#fff;
  border-radius:20px;padding:0 4px;font-size:7px;font-weight:900;line-height:1.7;display:none;}
/* ── Bottom nav: portrait mobile default ── */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nh);background:#fff;
  border-top:1px solid var(--border);display:flex;z-index:200;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.nitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;font-size:7px;font-weight:800;color:var(--subtle);cursor:pointer;text-decoration:none;transition:color .13s;}
.nitem.on{color:var(--orange);}.nico{font-size:14px;}
/* ── Desktop bar ── */
#desktopBar{display:none;position:fixed;bottom:0;left:0;right:0;height:44px;
  background:#fff;border-top:1px solid var(--border);z-index:200;
  align-items:center;padding:0 16px;gap:8px;box-shadow:0 -1px 0 var(--border);}
/* desktopBar: 4 nav items + center pagination, all distributed evenly */
#desktopBar > .dnitem{flex:1;max-width:120px;}
.dbar-center{flex:2;display:flex;align-items:center;justify-content:center;gap:10px;}
.dnitem{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;font-size:7px;font-weight:800;color:var(--subtle);cursor:pointer;
  text-decoration:none;transition:color .13s;padding:4px 12px;border-radius:6px;}
.dnitem:hover,.dnitem.on{color:var(--orange);}
.dnitem .nico{font-size:14px;}
/* #pager is never needed: desktop uses desktopBar, mobile uses infinite scroll */
#pager{display:none!important;}
/* ── Desktop breakpoint ── */
@media(min-width:768px)and(min-height:500px){
  #desktopBar{display:flex;}
  .bnav{display:none!important;}
  .main{padding-bottom:56px!important;}
}
/* ── Mobile compact (≤767px) — tighter sizes ── */
@media(max-width:767px){
  .hdr{height:50px;padding:0 10px;gap:6px;}
  .hdr-logo{width:28px;height:28px;font-size:14px;border-radius:7px;}
  .hdr-title{font-size:15px;}
  .hdr-pill{font-size:10px;padding:2px 8px;}
  .search-row{padding:6px 10px 0;}
  .sinput{height:36px;font-size:12.5px;}
  .psel{height:36px;font-size:11px;max-width:120px;}
  .clr{height:36px;font-size:11px;padding:0 10px;}
  .chips{padding:5px 10px;}
  .chip{font-size:9.5px;padding:3px 7px;}
  /* portrait: main has bottom padding for bnav */
  .main{padding-bottom:60px;}
  /* portrait bottom nav — tighter padding */
  .bnav{height:40px;}
  .nitem{font-size:6.5px;gap:0;padding:0 2px;}
  .nico{font-size:13px;}
}
@media(prefers-reduced-motion:reduce){.card{animation:none;display:flex;flex-direction:column;}}

/* ── Landscape phone: JS sets body.landscape-phone ── */
body.landscape-phone .hdr{height:44px!important;padding:0 8px;gap:4px;}
body.landscape-phone .hdr-logo{width:26px;height:26px;font-size:13px;border-radius:6px;}
body.landscape-phone .hdr-title{font-size:13.5px;}
body.landscape-phone .hdr-pill{font-size:9px;padding:2px 6px;}
body.landscape-phone .hnav{width:28px;height:28px;font-size:15px;}
/* Controls scrolls with page in landscape */
body.landscape-phone .controls{position:relative!important;top:auto!important;box-shadow:none;}
body.landscape-phone .search-row{padding:4px 8px 0;}
body.landscape-phone .chips{padding:3px 8px;}
body.landscape-phone .chip{font-size:9px;padding:2px 6px;}
/* Main needs no extra padding-top since controls is in flow */
body.landscape-phone #main{padding-top:0!important;}

/* ── Pioneer pill ── */
.pioneer-pill{
  position:absolute;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#F97316,#EA580C);
  color:#fff;font-size:11px;font-weight:800;border-radius:999px;
  padding:5px 16px;white-space:nowrap;text-decoration:none;z-index:10;
  letter-spacing:.1px;
  animation:pioneer-pulse 2.4s ease-in-out infinite;
  box-shadow:0 2px 10px rgba(249,115,22,.45);
}
@keyframes pioneer-pulse{
  0%,100%{transform:translateX(-50%) scale(1);    box-shadow:0 2px 10px rgba(249,115,22,.4);}
  50%    {transform:translateX(-50%) scale(1.07); box-shadow:0 4px 20px rgba(249,115,22,.7);}
}
@media(max-width:620px){.pioneer-pill{display:none;}}
</style>

const _KK_BUST='kkC_bust',_KK_D30=30*24*60*60*1000,_KK_D7=8*60*60*1000,_KK_H4=4*60*60*1000;
function kkGet(key){try{const e=JSON.parse(localStorage.getItem(key)||'null');if(!e||!e.v||!e.ts||!e.ttl)return null;if(e.bustable&&Number(localStorage.getItem(_KK_BUST)||0)>e.ts)return null;if(Date.now()-e.ts>e.ttl)return null;return e.v;}catch(_){return null;}}
function kkSet(key,val,ttlMs,bustable){try{localStorage.setItem(key,JSON.stringify({v:val,ts:Date.now(),ttl:ttlMs,bustable:!!bustable}));}catch(_){}}

async function fetchCsvCached(cacheKey,url,ttlMs,bustable){const hit=kkGet(cacheKey);if(hit!==null)return hit;const text=await fetchCsv(url);kkSet(cacheKey,text,ttlMs,bustable);return text;}

  const headers=rows[0].map(h=>(h||'').trim());
  const col=name=>headers.indexOf(name);
  const iName=col('Resort- Header/ResortName'),iCityRef=col('Resort- Header/CityRowID'),

    iIG=col('Resort- Socials/Instagram'),iCoords=col('Resort- Header/Coordinates'),
    iLogo=col('Resort- Header/ResortProfilePhoto'),iResortID=col('ResortID'),
    iKKBook=col('Resort - KKBook/Active'),iActive=col('Resorts - Switches/BetaActive?'),
    iBookings=col('Resorts - Bookings/HasBookings'),iBookLink=col('Resorts - Bookings/BookingLink'),
    iPOP=col('Resort - BookingOptions/POP?'),iCamp=col('Resort - BookingOptions/Camp?'),
    iGlamp=col('Resort - BookingOptions/Glamp'),iChalet=col('Resort - BookingOptions/Chalet'),
    iCottage=col('Resort - BookingOptions/Cottage'),iLodge=col('Resort - BookingOptions/Lodge'),
    iBnB=col('Resort - BookingOptions/B&B'),iGuest=col('Resort - BookingOptions/Guesthouse'),
    iPets=col('Resort - BookingOptions/Pets'),iWed=col('Resort - BookingOptions/Wedding'),
    iConf=col('Resort - BookingOptions/Conference'),iRoom=col('Resort - BookingOptions/Room?'),
    iBackpack=col('Resort - BookingOptions/BackPack'),iFamilyHome=col('Resort - BookingOptions/FamilyHome'),
    iLankSlaap=col('Resort - BookingOptions/LankSlaap'),iNiche=col('Resort - BookingOptions/Niche'),
    iLankstaan=col('Resort - BookingOptions/Lankstaan?'),iExcursions=col('Resort - BookingOptions/Excursions'),
    iFunctions=col('Resort - BookingOptions/Functions'),iHunting=col('Resort - BookingOptions/Hunting'),iOffGrid=col('Resort - BookingOptions/OffGrid'),
    iMembersOnly=col('Resorts - Switches/MembersOnly?'),iTotalViews=col('Scoring/TotalViews');
  RESORTS=[];
  rows.slice(1).forEach(row=>{
    const name=(row[iName]||'').trim();if(!name)return;
    const cityRef=(row[iCityRef]||'').trim(),cityObj=CITIES[cityRef]||{};
    let provName='';
    if(iProvRef>=0&&row[iProvRef])provName=PROVINCES[(row[iProvRef]||'').trim()]||'';
    if(!provName&&cityObj.provId)provName=PROVINCES[cityObj.provId]||'';
    RESORTS.push({resortId:(row[iResortID]||'').trim(),name,city:cityObj.name||'',province:provName,
      address:(row[iAddr]||'').trim(),photo:photoUrl((row[iPhoto]||'').trim()),

      email:(row[iEmail]||'').trim(),phone:(row[iPhone]||'').trim().replace(/\.0$/,''),
      website:(row[iWeb]||'').trim(),facebook:(row[iFB]||'').trim(),
      instagram:(row[iIG]||'').trim(),coordinates:(row[iCoords]||'').trim(),
      kkBook:truthy(row[iKKBook]),active:truthy(row[iActive]),hasBookings:truthy(row[iBookings]),
      bookingLink:(row[iBookLink]||'').trim(),
      options:{POP:truthy(row[iPOP]),Camp:truthy(row[iCamp]),Glamp:truthy(row[iGlamp]),

        'B&B':truthy(row[iBnB]),Guesthouse:truthy(row[iGuest]),Pets:truthy(row[iPets]),
        Wedding:truthy(row[iWed]),Conference:truthy(row[iConf]),Room:truthy(row[iRoom]),
        BackPack:truthy(row[iBackpack]),FamilyHome:truthy(row[iFamilyHome]),LankSlaap:truthy(row[iLankSlaap]),
        Niche:truthy(row[iNiche]),Lankstaan:truthy(row[iLankstaan]),Excursions:truthy(row[iExcursions]),
        Functions:truthy(row[iFunctions]),Hunting:truthy(row[iHunting]),OffGrid:truthy(row[iOffGrid])},
      membersOnly:truthy(row[iMembersOnly]),totalViews:Number(row[iTotalViews])||0});
  });

  document.getElementById('grid').style.display='grid';

  const grandTotal=RESORTS.reduce((s,r)=>s+(r.totalViews||0),0);

function applyIncomingSearchPayload(){
  const params=new URLSearchParams(location.search);
  const inQ=params.get('q')||'',inA=params.get('area')||'',inCat=params.get('cat')||'';

  if(inCat){filters.add(inCat);}

async function fetchCsv(url){
  const res=await fetch(url+(url.includes('?')?'&':'?')+'_ts='+Date.now(),{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);return res.text();
}
function parseCsv(text){
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;}
    else{if(c==='"')inQ=true;else if(c===','){row.push(cur);cur='';}else if(c==='\r'){}
    else if(c==='\n'){row.push(cur);cur='';rows.push(row);row=[];}else cur+=c;}}
  if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;
}
function truthy(v){if(!v)return false;const s=String(v).trim().toLowerCase();return s==='true'||s==='1'||s==='yes';}
function photoUrl(raw){if(!raw||raw.trim()==='')return null;const url=raw.trim();if(url.includes(PLACEHOLDER_ID))return null;let m=url.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);if(m)return'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w600';m=url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);if(m)return'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w600';if(/\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(url))return url;if(/pexels\.com|fbcdn\.net|unsplash|imgix|cloudinary|amazonaws|googleusercontent/i.test(url))return url;return null;}
function cleanDesc(raw){if(!raw)return'';return raw.replace(/\+\+\w+\+\+/g,'').replace(/%%\w+%%/g,'').replace(/\|\/?(center|right|left)\|/g,'').replace(/##\s*/g,'').replace(/\*\*|__/g,'').replace(/\\n/g,' ').replace(/\s+/g,' ').trim().slice(0,220);}
function waNum(phone){if(!phone)return'';const p=String(phone).replace(/\s/g,'').replace(/\.0$/,'');if(!p)return'';return'27'+p.replace(/^0/,'').replace(/^\+27/,'');}
function slugify(s){return String(s||'').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,60);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setOffsets(){
  // Cache values outside rAF to avoid layout thrashing
  var hh=document.querySelector('.hdr').offsetHeight;

    }else{
      ctrl.style.marginTop='';
      ctrl.style.top=hh+'px';
      document.getElementById('main').style.paddingTop=(hh+ctrlH+6)+'px';

}

let chipsExpanded=false;
function renderChips(){
  const container=document.getElementById('chips-in');
  container.innerHTML=FILTER_CHIPS.map(c=>`<div class="chip${filters.has(c.f)?' on':''}" data-f="${esc(c.f)}" onclick="toggleChip(this)">${c.icon} ${esc(c.label)}</div>`).join('')+`<div class="chip chip-viewall" id="viewAllBtn" onclick="toggleChipsExpanded()">View all Categories &#8250;</div>`;
  updateChipsOverflow();
}
function toggleChipsExpanded(){chipsExpanded=!chipsExpanded;updateChipsOverflow();setOffsets();}
function updateChipsOverflow(){
  const wrap=document.getElementById('chips'),container=document.getElementById('chips-in');
  const viewAllBtn=document.getElementById('viewAllBtn');
  const chipEls=Array.from(container.querySelectorAll('.chip[data-f]'));
  if(!wrap||!container||!viewAllBtn)return;
  if(chipsExpanded){chipEls.forEach(el=>el.style.display='');viewAllBtn.style.display='';viewAllBtn.textContent='‹ Show less';return;}
  chipEls.forEach(el=>el.style.display='');viewAllBtn.style.display='';viewAllBtn.textContent='View all Categories ›';
  const containerWidth=wrap.clientWidth,gap=5,viewAllWidth=viewAllBtn.offsetWidth;
  let totalWidth=0,shown=0;
  for(let i=0;i<chipEls.length;i++){const w=chipEls[i].offsetWidth;if(totalWidth+w+gap+viewAllWidth+gap>containerWidth)break;totalWidth+=w+gap;shown++;}
  chipEls.forEach((el,i)=>{el.style.display=i<shown?'':'none';});
  if(shown>=chipEls.length)viewAllBtn.style.display='none';
}
function toggleChip(el){const f=el.dataset.f;if(filters.has(f)){filters.delete(f);el.classList.remove('on');}else{filters.add(f);el.classList.add('on');}render();}
function onProv(){prov=document.getElementById('psel').value;render();}
function onSearch(){q=document.getElementById('sinput').value.trim().toLowerCase();document.getElementById('sx').classList.toggle('show',q.length>0);render();}
function clearSearch(){document.getElementById('sinput').value='';q='';document.getElementById('sx').classList.remove('show');render();}
function clearAll(){q='';prov='';filters.clear();document.getElementById('sinput').value='';document.getElementById('sx').classList.remove('show');document.getElementById('psel').value='';document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));render();}
function getFiltered(){
  let list=RESORTS.filter(r=>r.active!==false);
  if(prov)list=list.filter(r=>r.province===prov);
  if(q)list=list.filter(r=>r.name.toLowerCase().includes(q)||r.city.toLowerCase().includes(q)||r.province.toLowerCase().includes(q)||r.address.toLowerCase().includes(q)||r.description.toLowerCase().includes(q));
  for(const f of filters){if(f==='hasBookings')list=list.filter(r=>r.hasBookings);else list=list.filter(r=>r.options?.[f]);}
  list.sort((a,b)=>{const aKK=a.kkBook?0:1,bKK=b.kkBook?0:1;if(aKK!==bKK)return aKK-bKK;const aBook=a.bookingLink?0:1,bBook=b.bookingLink?0:1;if(aBook!==bBook)return aBook-bBook;return(a.name||'').localeCompare(b.name||'');});
  return list;
}
const OL={POP:'POP',Camp:'Camp',Glamp:'Glamp',Chalet:'Chalet',Cottage:'Cottage',Lodge:'Lodge','B&B':'B&B',Guesthouse:'Guesthouse',Pets:'Pets',Wedding:'Weddings',Conference:'Conference'};
function getTags(r){return Object.entries(OL).filter(([k])=>r.options?.[k]).map(([,v])=>v);}
function render(){filtered=getFiltered();curPage=0;renderPage();window.scrollTo({top:0,behavior:'smooth'});}
function getGridCols(){const w=window.innerWidth;return w>=1140?4:w>=820?3:w>=500?2:1;}
let cardRevealObserver=null;
function getCardRevealObserver(){
  if(cardRevealObserver)return cardRevealObserver;
  cardRevealObserver=new IntersectionObserver((entries)=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('reveal-in');cardRevealObserver.unobserve(entry.target);}});},{rootMargin:'0px 0px -8% 0px',threshold:0.05});
  return cardRevealObserver;
}
function isLandscapePhone(){
  // Simple, reliable: landscape phone = wider than tall AND viewport height < 500px
  // (covers Vivo V2205 and similar — tablet landscape typically has h>500)
  return window.innerWidth>window.innerHeight&&window.innerHeight<500;
}
function isMobileView(){return window.innerWidth<600||isLandscapePhone();}
function applyLayoutMode(){
  var desktop=window.innerWidth>=768&&window.innerHeight>=500;
  var land=isLandscapePhone();
  var portrait=!desktop&&!land;
  // Apply body class so CSS can target landscape-phone mode
  document.body.classList.toggle('landscape-phone',land);
  // Bottom nav: portrait mobile only
  var bnav=document.getElementById('bnav');
  if(bnav)bnav.style.setProperty('display',portrait?'flex':'none','important');
  // Header nav icons: landscape phone only
  var hdrNav=document.getElementById('hdr-nav');
  if(hdrNav)hdrNav.style.display=land?'flex':'none';
  // Desktop bar: desktop only
  var deskBar=document.getElementById('desktopBar');
  if(deskBar)deskBar.style.display=desktop?'flex':'none';
  // Pager: desktop only
  var pager=document.getElementById('pager');
  if(pager&&!desktop)pager.style.setProperty('display','none','important');
  // Main bottom padding
  var main=document.getElementById('main');
  if(main)main.style.paddingBottom=portrait?'60px':desktop?'56px':'12px';
  setOffsets();
  if(dataLoaded)renderPage();
}
function renderPage(){
  if(!dataLoaded)return;
  const grid=document.getElementById('grid'),empty=document.getElementById('empty');
  const hpill=document.getElementById('hpill');
  if(hpill)hpill.textContent=filtered.length+' resorts';
  if(!filtered.length){grid.style.display='none';empty.style.display='block';updatePager();return;}
  grid.style.display='grid';empty.style.display='none';
  if(isMobileView()){
    grid.innerHTML='';
    const observer=getCardRevealObserver();
    filtered.forEach((r,i)=>{const card=mkCard(r,i);card.classList.add('reveal-pending');grid.appendChild(card);observer.observe(card);});
    document.getElementById('pager').style.display='none';
    return;
  }
  const cols=getGridCols(),perPage=cols*4,totalPages=Math.ceil(filtered.length/perPage);
  if(curPage>=totalPages)curPage=totalPages-1;if(curPage<0)curPage=0;
  const start=curPage*perPage,end=Math.min(start+perPage,filtered.length);
  grid.innerHTML='';
  for(let i=start;i<end;i++)grid.appendChild(mkCard(filtered[i],i));
  updatePager(totalPages,perPage);
}
function updatePager(totalPages,perPage){
  const pager=document.getElementById('pager');
  const dprev=document.getElementById('dpg-prev'),dnext=document.getElementById('dpg-next'),dinfo=document.getElementById('dpg-info');
  if(!totalPages||totalPages<=1){pager.style.display='none';if(dprev)dprev.style.visibility='hidden';if(dnext)dnext.style.visibility='hidden';if(dinfo)dinfo.textContent='';return;}
  pager.style.display='flex';
  const start=curPage*perPage+1,end=Math.min((curPage+1)*perPage,filtered.length);
  document.getElementById('pg-prev').disabled=curPage===0;document.getElementById('pg-next').disabled=curPage>=totalPages-1;
  document.getElementById('pg-info').textContent='Pg.'+(curPage+1)+'/'+totalPages+' ('+start+'\u2013'+end+')';
  if(dprev){dprev.style.visibility='';dprev.disabled=curPage===0;}if(dnext){dnext.style.visibility='';dnext.disabled=curPage>=totalPages-1;}
  if(dinfo)dinfo.textContent='Page '+(curPage+1)+' of '+totalPages;
}
function goPage(dir){curPage+=dir;renderPage();window.scrollTo({top:0,behavior:'smooth'});}
function openResortProfile(idx){const r=filtered[idx];if(!r)return;window.location.href='resort.html?id='+encodeURIComponent(r.resortId||slugify(r.name));}
function mkCard(r,idx){
  const card=document.createElement('div');card.className='card';
  const loc=[r.city,r.province].filter(Boolean).join(', '),tags=getTags(r).slice(0,3),wa=waNum(r.phone);
  const imgHtml=r.photo?`<img class="cimg" src="${esc(r.photo)}" alt="${esc(r.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'';
  const badges=[];
  if(r.kkBook)badges.push('<span class="bdg" style="background:#F97316;color:#fff;font-size:12px;padding:3px 6px;border-radius:6px;letter-spacing:1px;">&#9733;&#128197;</span>');
  if(r.membersOnly)badges.push('<span class="bdg" style="background:rgba(124,58,237,.88);color:#fff;">&#128274;</span>');
  if(r.hasBookings)badges.push('<span class="bdg bdg-b">&#128197;</span>');
  if(r.options?.Pets)badges.push('<span class="bdg bdg-pet">&#128062;</span>');
  if(r.options?.Niche)badges.push('<span class="bdg" style="background:rgba(20,184,166,.9);color:#fff;">&#10022;</span>');
  if(r.options?.OffGrid)badges.push('<span class="bdg" style="background:rgba(15,118,110,.9);color:#fff;">&#9728;&#65039; Off-Grid</span>');
  if(r.options?.Wedding)badges.push('<span class="bdg" style="background:rgba(219,39,119,.9);color:#fff;">&#128141;</span>');
  if(r.options?.Conference)badges.push('<span class="bdg" style="background:rgba(71,85,105,.9);color:#fff;">&#127970;</span>');
  if(r.options?.Functions)badges.push('<span class="bdg" style="background:rgba(217,119,6,.9);color:#fff;">&#127881;</span>');
  if(r.options?.Hunting)badges.push('<span class="bdg" style="background:rgba(120,53,15,.9);color:#fff;">&#127993;</span>');
  const acts=[];
  if(wa)acts.push(`<a class="cact ag" href="https://wa.me/${wa}" target="_blank">&#128172; WhatsApp</a>`);
  if(r.email)acts.push(`<a class="cact as" href="mailto:${esc(r.email)}" target="_blank">&#9993;&#65039; Email</a>`);
  if(!acts.length)acts.push(`<button class="cact as" onclick="openResortProfile(${idx})">&#8505;&#65039; More</button>`);
  const logoHtml=r.logo?`<div class="clogo-wrap"><img src="${esc(r.logo)}" alt="${esc(r.name)} logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="clogo-ph" style="display:none">&#127957;&#65039;</div></div>`:'';
  card.innerHTML=`<div style="position:relative">${imgHtml}<div class="cph" style="${r.photo?'display:none':''}">&#127957;&#65039;</div><div class="cbadges">${badges.join('')}</div>${logoHtml}</div><div class="cbody"><div class="cname">${esc(r.name)}</div><div class="cloc">&#128205; ${esc(loc)}</div>${r.description?`<div class="cdesc">${esc(r.description)}</div>`:''} ${tags.length?`<div class="ctags">${tags.map(t=>`<span class="ctag">${esc(t)}</span>`).join('')}</div>`:''}<div class="cacts">${acts.slice(0,3).join('')}</div></div>`;
  card.addEventListener('click',e=>{if(e.target.closest('a,button'))return;openResortProfile(idx);});
  return card;
}
function fetchTotalViews(){
  fetch(ADMIN_SCRIPT_URL+'?action=getTotalViews').then(r=>r.json()).then(res=>{if(res&&res.success){const el=document.getElementById('totalViewsBar');if(el)el.textContent='\uD83D\uDC41\uFE0F '+Number(res.totalViews).toLocaleString()+' total resort views across KampKiepie';}}).catch(()=>{});
}
