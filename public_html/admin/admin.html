<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<title>KampKiepie – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F97316;--orange-l:#FFF7ED;--orange-d:#EA580C;
  --green:#16A34A;--green-l:#F0FDF4;
  --red:#DC2626;--red-l:#FEF2F2;
  --blue:#3B82F6;--blue-l:#EFF6FF;
  --bg:#F4F4F6;--card:#FFFFFF;--text:#18181B;
  --muted:#6B7280;--subtle:#9CA3AF;--border:#E4E4E7;--r:12px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.hdr{background:#fff;border-bottom:1px solid var(--border);padding:11px 20px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;
  box-shadow:0 1px 4px rgba(0,0,0,.06);}
.hdr-logo{width:32px;height:32px;border-radius:8px;background:var(--orange);
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.hdr-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;flex:1;}
.hdr-title em{color:var(--orange);font-style:normal;}
.hdr-user{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;}
.logout-btn{background:var(--red-l);color:var(--red);border:none;border-radius:8px;
  padding:5px 12px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;}
.screen{display:none;}.screen.on{display:block;}
.login-wrap{max-width:420px;margin:60px auto;padding:0 16px;}
.login-card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:32px;}
.login-logo{text-align:center;font-size:48px;margin-bottom:8px;}
.login-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:22px;text-align:center;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--muted);font-weight:600;text-align:center;margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.field input{width:100%;height:44px;border:1.5px solid var(--border);border-radius:10px;
  padding:0 14px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;
  color:var(--text);background:var(--bg);outline:none;transition:border-color .18s;}
.field input:focus{border-color:var(--orange);background:#fff;}
.btn-login{width:100%;height:46px;border:none;border-radius:10px;background:var(--orange);
  color:#fff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;
  cursor:pointer;transition:background .15s;}
.btn-login:hover{background:var(--orange-d);}
.btn-login:disabled{opacity:.6;cursor:default;}
.msg{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700;margin-bottom:16px;}
.msg-err{background:var(--red-l);color:var(--red);}
.msg-ok{background:var(--green-l);color:var(--green);}
.msg-info{background:var(--blue-l);color:var(--blue);}
.dash{max-width:1100px;margin:0 auto;padding:24px 16px 60px;}
.dash-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.dash-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;flex:1;}
.btn-back{background:var(--orange-l);color:var(--orange-d);border:none;border-radius:8px;
  padding:7px 14px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;}
.btn-bookings{background:var(--green-l);color:var(--green);border:none;border-radius:8px;
  padding:7px 14px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;}
.btn-bookings:disabled{opacity:.6;cursor:default;}
.resort-grid{display:grid;grid-template-columns:1fr;gap:10px;}
@media(min-width:600px){.resort-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:900px){.resort-grid{grid-template-columns:repeat(3,1fr);}}
.rc{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:14px 16px;cursor:pointer;transition:transform .15s,box-shadow .15s;
  border:1.5px solid transparent;}
.rc:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.1);border-color:var(--orange);}
.rc-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;margin-bottom:3px;}
.rc-id{font-size:11px;color:var(--subtle);font-weight:600;}
.rc-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;margin-top:6px;}
.rc-y{background:var(--green-l);color:var(--green);}.rc-o{background:#FFF7ED;color:#C2410C;}.rc-b{background:#EFF6FF;color:#1D4ED8;}
.rc-n{background:var(--red-l);color:var(--red);}
.search-input{width:100%;height:40px;border:1.5px solid var(--border);border-radius:10px;
  padding:0 14px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;
  outline:none;margin-bottom:16px;transition:border-color .18s;}
.search-input:focus{border-color:var(--orange);}
.edit-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:24px;}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:700px){.form-grid{grid-template-columns:1fr 1fr;}}
.fg{display:flex;flex-direction:column;gap:5px;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.fg input,.fg textarea,.fg select{border:1.5px solid var(--border);border-radius:9px;
  padding:0 12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;
  color:var(--text);background:var(--bg);outline:none;transition:border-color .18s;width:100%;}
.fg input{height:40px;}
.fg textarea{min-height:90px;resize:vertical;padding:9px 12px;line-height:1.5;}
.fg input:focus,.fg textarea:focus{border-color:var(--orange);background:#fff;}
.cb-group{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0;}
.cb-item{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;}
.cb-item input{width:16px;height:16px;accent-color:var(--orange);cursor:pointer;flex-shrink:0;}
.divider{border-top:2px solid var(--border);padding-top:12px;padding-bottom:12px;
  font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--orange);
  cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;}
.divider:hover{color:var(--green);}
.sec-arrow{font-size:10px;display:inline-block;transition:transform .2s;flex-shrink:0;}
.sec-arrow.open{transform:rotate(90deg);}
.sec-body{display:none;}
.sec-body .form-grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:10px;}
@media(min-width:700px){.sec-body .form-grid{grid-template-columns:1fr 1fr;}}
.acc-pill-row{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 6px;}
.acc-pill{padding:5px 14px;border-radius:20px;border:2px solid var(--border);background:#fff;font-size:12px;font-weight:800;cursor:pointer;color:var(--text);transition:border-color .15s,background .15s,color .15s;}
.acc-pill.on{background:var(--green);border-color:var(--green);color:#fff;}
.acc-pill:hover:not(.on){border-color:var(--green);color:var(--green);}
.acc-editor-panel{background:var(--bg);border-radius:12px;padding:16px;margin-top:8px;border:1.5px solid var(--border);display:none;}
.acc-editor-panel.on{display:block;}
.booking-mode-pair{display:flex;gap:10px;margin-top:4px;}
.bm-radio{flex:1;display:flex;align-items:center;gap:8px;border:2px solid var(--border);border-radius:10px;
  padding:10px 14px;cursor:pointer;transition:border-color .15s,background .15s;}
.bm-radio input{width:16px;height:16px;accent-color:var(--green);cursor:pointer;flex-shrink:0;}
.bm-radio-label{font-size:13px;font-weight:800;color:var(--text);}
.bm-radio-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;}
.bm-radio.selected{border-color:var(--green);background:var(--green-l);}
.bm-radio.selected .bm-radio-label{color:var(--green);}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:4px}
.photo-card{border:2px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.photo-card:hover{border-color:var(--green)}
.photo-card img{width:100%;height:90px;object-fit:cover;display:block}
.photo-card-name{font-size:10px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.acc-editor-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;color:var(--orange);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px;}
.save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);
  padding:12px 20px;display:flex;gap:10px;justify-content:flex-end;
  box-shadow:0 -2px 8px rgba(0,0,0,.06);z-index:50;margin-top:20px;}
.save-bar button{min-width:120px;height:42px;border-radius:9px;border:none;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;}
.btn-save{background:var(--orange);color:#fff;}
.btn-cancel{background:var(--bg);color:var(--text);border:1.5px solid var(--border) !important;}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--orange);
  border-radius:50%;margin:40px auto;animation:spin .8s linear infinite;display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin-wrap{text-align:center;padding:20px;color:var(--muted);font-weight:700;}
/* ── IMAGE MANAGER ── */
.btn-images{background:#EDE9FE;color:#7C3AED;border:none;border-radius:8px;
  padding:7px 14px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;}
.btn-images:disabled{opacity:.6;cursor:default;}
.img-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  display:none;align-items:flex-end;justify-content:center;padding:0;}
.img-modal-overlay.on{display:flex;}
@media(min-width:640px){.img-modal-overlay{align-items:center;padding:16px;}}
.img-modal-box{width:100%;max-width:880px;max-height:92vh;overflow:auto;background:#fff;
  border-radius:20px 20px 0 0;box-shadow:0 30px 80px rgba(0,0,0,.3);}
@media(min-width:640px){.img-modal-box{border-radius:16px;}}
.img-modal-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
.img-modal-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;}
.img-modal-body{padding:20px;}
.upload-zone{border:2.5px dashed var(--border);border-radius:12px;padding:30px 20px;
  text-align:center;background:var(--bg);cursor:pointer;transition:border-color .15s,background .15s;}
.upload-zone:hover,.upload-zone.drag{border-color:var(--orange);background:#fffaf5;}
.upload-zone-icon{font-size:34px;margin-bottom:8px;}
.upload-zone-title{font-weight:800;font-size:15px;margin-bottom:4px;}
.upload-zone-sub{font-size:12px;color:var(--muted);font-weight:700;line-height:1.6;}
.img-grid-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:16px;}
.img-card{border:1.5px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
.img-card img{width:100%;height:110px;object-fit:cover;display:block;background:var(--bg);}
.img-card-name{font-size:10px;font-weight:800;color:var(--muted);padding:5px 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--border);}
.img-card-acts{display:flex;gap:4px;padding:5px 6px;}
.img-card-acts button{flex:1;border:none;border-radius:6px;padding:5px 0;
  font-family:'Nunito',sans-serif;font-size:10.5px;font-weight:800;cursor:pointer;}
.btn-img-rename{background:var(--blue-l);color:var(--blue);}
.btn-img-delete{background:var(--red-l);color:var(--red);}
.upload-progress{margin-top:10px;}
.upload-item{display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:12px;font-weight:700;}
.upload-item-status{flex-shrink:0;font-size:14px;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="hdr">
  <img src="../KampKiepieLogo.png" alt="KampKiepie" style="height:36px;width:auto;display:block;border-radius:7px;">
  <div class="hdr-title">Kamp<em>Kiepie</em> Admin</div>
  <div class="hdr-user" id="hdrUser" style="display:none">
    <span id="hdrName"></span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>
<!-- LOGIN -->
<div class="screen" id="screenLogin">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">&#127957;&#65039;</div>
      <div class="login-title">Resort Admin</div>
      <div class="login-sub">Sign in with your resort email address</div>
      <button onclick="closeAdminTab()" style="background:var(--bg);color:var(--muted);border:none;border-radius:8px;padding:6px 14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;margin-bottom:16px;">&larr; Back</button>
      <div id="loginMsg"></div>
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
      </div>
      <div id="passField" class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password">
      </div>
      <div id="newPassField" class="field" style="display:none">
        <label>Set New Password</label>
        <input type="password" id="newPassword" placeholder="Choose a password (min 6 chars)">
      </div>
      <div id="confirmPassField" class="field" style="display:none">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your password">
      </div>
      <button class="btn-login" id="loginBtn" onclick="handleLogin()">Sign In</button>
    </div>
  </div>
</div>
<!-- RESORT LIST -->
<div class="screen" id="screenList">
  <div class="dash">
    <div class="dash-hdr" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div class="dash-title">All Resorts</div>
      <select id="listFilterSel" onchange="setListFilter(this.value)"
        style="display:none;height:32px;border:1.5px solid var(--border);border-radius:8px;
        padding:0 10px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;
        color:var(--text);background:#fff;cursor:pointer;outline:none;">
        <option value="all">All Resorts</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="kkbook">KKBook</option>
        <option value="online">Online Bookings</option>
        <option value="external">External Bookings</option>
      </select>
      <button id="btnSitemap" onclick="updateResortSitemap()"
        style="display:none;background:#173B2C;color:#fff;border:none;border-radius:8px;
        padding:6px 14px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;
        cursor:pointer;white-space:nowrap;">&#128506;&#65039; Update Sitemap</button>
    </div>
    <input class="search-input" id="listSearch" placeholder="Search resorts..." oninput="filterList()">
    <div id="resortList" class="resort-grid">
      <div class="spin-wrap"><div class="spin"></div>Loading...</div>
    </div>
  </div>
</div>
<!-- EDIT SCREEN -->
<div class="screen" id="screenEdit">
  <div class="dash">
    <div class="dash-hdr">
      <button class="btn-back" onclick="goBack()">&larr; Back</button>
      <div class="dash-title" id="editTitle">Edit Resort</div>
      <button class="btn-images" id="btnManageImages" onclick="openImageManager()" style="display:none">&#128247; Images</button>
      <button class="btn-bookings" id="btnManageBookings" onclick="goToBookingBackend()">&#128197; Manage Bookings</button>
    </div>
    <div id="editMsg"></div>
    <div id="editWrap"><div class="spin-wrap"><div class="spin"></div>Loading...</div></div>
    <div class="save-bar">
      <button class="btn-cancel" onclick="goBack()">Cancel</button>
      <button class="btn-save" onclick="saveResort()">&#128190; Save Changes</button>
      <button class="btn-reset" id="btnReset" onclick="openResetModal()" style="display:none">&#128465; Reset Data</button>
    </div>
  </div>
</div>
<!-- IMAGE MANAGER MODAL -->
<div class="img-modal-overlay" id="imgModal" onclick="if(event.target===this)closeImgModal()">
  <div class="img-modal-box">
    <div class="img-modal-hdr">
      <div>
        <div class="img-modal-title">&#128247; Manage Images</div>
        <div style="font-size:11px;color:var(--muted);font-weight:700;margin-top:2px" id="imgModalFolder"></div>
      </div>
      <button onclick="closeImgModal()" style="background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:6px 14px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;">&times; Close</button>
    </div>
    <div class="img-modal-body">
      <!-- Upload zone -->
      <div class="upload-zone" id="uploadZone"
           onclick="document.getElementById('imgFileInput').click()"
           ondragover="event.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="this.classList.remove('drag');handleUpload(event.dataTransfer.files)">
        <div class="upload-zone-icon">&#128444;&#65039;</div>
        <div class="upload-zone-title">Upload images</div>
        <div class="upload-zone-sub">
          Tap to choose files &mdash; on mobile you can use your <strong>camera</strong> or photo library<br>
          JPG &middot; PNG &middot; WebP &middot; GIF &nbsp;&bull;&nbsp; up to 10 MB each
        </div>
      </div>
      <!-- Hidden file input — accept="image/*" gives "Camera / Files" sheet on mobile -->
      <input type="file" id="imgFileInput" accept="image/*" multiple style="display:none"
             onchange="handleUpload(this.files)">
      <div id="imgUploadProgress"></div>
      <div id="imgGridWrap">
        <div style="text-align:center;padding:30px 0;color:var(--muted);font-weight:700;">Loading images&hellip;</div>
      </div>
    </div>
  </div>
</div>

  'Resort - BookingOptions/Wedding': 'opt_wedding',

let SITEMAP_SECRET  = '';

// ── CONFIG ────────────────────────────────────────────────────────────────────
async function loadConfig() {
  try {
    const res  = await fetch('../config.txt', { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    text.split(/\r?\n/).forEach(line => {
      const t = line.trim();
      if (!t || t.startsWith('#')) return;
      const ix = t.indexOf(':');
      if (ix < 0) return;
      const k = t.slice(0, ix).trim();
      const v = t.slice(ix + 1).trim();
      if (k === 'sitemap_secret')      SITEMAP_SECRET = v;
      if (k === 'adminbackend_script') {
        BACKEND_URL = v;
        if (v) fetch(v + '?action=ping&_ts=' + Date.now(), { cache:'no-store' }).catch(() => {});
      }
    });
  } catch(e) {}
}

// ── SCREENS ───────────────────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function showMsg(elId, text, type) {
  document.getElementById(elId).innerHTML = text
    ? '<div class="msg msg-' + (type || 'err') + '">' + text + '</div>' : '';
}

// ── GAS backend (KKAdminBackend — bookings/images) ────────────────────────────
async function apiBackend(data, method) {
  if (!BACKEND_URL) throw new Error('Booking backend URL not configured in config.txt');
  method = method || 'GET';
  if (method === 'GET') {
    const params = new URLSearchParams();
    Object.entries(data).forEach(([k, v]) => params.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v)));
    params.set('_ts', Date.now());
    const res  = await fetch(BACKEND_URL + '?' + params.toString(), { method:'GET', redirect:'follow' });
    const text = await res.text();
    try { return JSON.parse(text); } catch(e) { throw new Error('Bad response from backend'); }
  }
  const form = new URLSearchParams();
  Object.entries(data).forEach(([k, v]) => form.set(k, typeof v === 'object' ? JSON.stringify(v) : String(v)));
  const res  = await fetch(BACKEND_URL, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}, body: form.toString() });
  const text = await res.text();
  try { return JSON.parse(text); } catch(e) { throw new Error('Bad response from backend'); }
}

async function getBackendSession() {
  if (BACKEND_SESSION) return BACKEND_SESSION;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('Not authenticated');
  const resortId = SESSION.role === 'KampKiepie'
    ? (CURRENT_RESORT ? CURRENT_RESORT['ResortID'] : '')
    : SESSION.resortId;
  const exchRes = await apiBackend({ action:'exchangeBootstrapToken', token: session.access_token, resortId });
  if (!exchRes.success) throw new Error('Session exchange failed: ' + (exchRes.error || ''));
  BACKEND_SESSION = exchRes.session;
  return BACKEND_SESSION;
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
async function handleLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn      = document.getElementById('loginBtn');
  if (!email)    { showMsg('loginMsg', 'Please enter your email address'); return; }
  if (!password) { showMsg('loginMsg', 'Please enter your password'); return; }
  btn.disabled = true; btn.textContent = 'Signing in\u2026';
  showMsg('loginMsg', '');
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign In';
  if (error) { showMsg('loginMsg', error.message || 'Sign in failed. Check email and password.'); return; }
  startSession(data.user);
}

function startSession(user) {
  const meta     = user.app_metadata || {};
  const role     = meta.role      || 'Super';
  const resortId = String(meta.resort_id || '');
  const name     = meta.name      || user.email;
  SESSION = { role, resortId, name, email: user.email };
  if (role === 'Super' || role === 'Manager' || role === 'Admin' || role === 'Finance') {
    try { localStorage.setItem('kkIsResortStaff', 'true'); } catch(e) {}
  }
  document.getElementById('hdrUser').style.display = 'flex';
  document.getElementById('hdrName').textContent   = name;
  if (role === 'KampKiepie') { show('screenList'); loadList(); }
  else { show('screenEdit'); document.getElementById('editTitle').textContent = name; loadEdit(resortId); }
}

async function logout() {
  await sb.auth.signOut();
  try { localStorage.removeItem('kkIsResortStaff'); } catch(e) {}
  SESSION = null; BACKEND_SESSION = null;
  show('screenLogin');
  document.getElementById('hdrUser').style.display = 'none';
  document.getElementById('loginEmail').value    = '';
  document.getElementById('loginPassword').value = '';
}

function closeAdminTab() { window.close(); }
function goBack() {
  BACKEND_SESSION = null;
  if (SESSION && SESSION.role === 'KampKiepie') show('screenList');
  else window.close();
}

// ── RESORT LIST ───────────────────────────────────────────────────────────────
async function loadList() {
  document.getElementById('resortList').innerHTML = '<div class="spin-wrap"><div class="spin"></div>Loading...</div>';
  const { data, error } = await sb.from('resorts')
    .select('resort_id, resort_name, beta_active, kk_book_active, has_bookings')
    .order('resort_name');
  if (error) { document.getElementById('resortList').innerHTML = '<div class="msg msg-err">' + esc(error.message) + '</div>'; return; }
  ALL_RESORTS = (data || []).map(r => ({
    resortId:    String(r.resort_id),
    name:        r.resort_name || '',
    betaActive:  !!r.beta_active,
    active:      !!r.kk_book_active,
    hasBookings: !!r.has_bookings,
  }));
  LIST_FILTER = 'all';
  const sel = document.getElementById('listFilterSel');
  if (sel) sel.value = 'all';
  renderList(ALL_RESORTS);
  var btnSitemap = document.getElementById('btnSitemap');
  var listSel    = document.getElementById('listFilterSel');
  if (btnSitemap) btnSitemap.style.display = '';
  if (listSel)    listSel.style.display    = '';
}

function setListFilter(val) { LIST_FILTER = val; applyFilters(); }
function filterList()        { applyFilters(); }
function applyFilters() {
  const q = document.getElementById('listSearch').value.toLowerCase();
  var list = ALL_RESORTS;
  if (q) list = list.filter(r => r.name.toLowerCase().includes(q) || r.resortId.includes(q));
  switch (LIST_FILTER) {
    case 'active':   list = list.filter(r =>  r.betaActive);                   break;
    case 'inactive': list = list.filter(r => !r.betaActive);                   break;
    case 'kkbook':   list = list.filter(r =>  r.active);                       break;
    case 'online':   list = list.filter(r =>  r.hasBookings);                  break;
    case 'external': list = list.filter(r =>  r.hasBookings && !r.active);     break;
  }
  renderList(list);
}

function renderList(list) {
  if (!list.length) {
    document.getElementById('resortList').innerHTML = '<div style="color:var(--muted);font-weight:700;padding:20px;">No resorts found</div>';
    return;
  }
  document.getElementById('resortList').innerHTML = list.map(function(r) {
    return '<div class="rc" onclick="selectResort(\'' + esc(r.resortId) + '\',\'' + esc(r.name) + '\')">'
      + '<div class="rc-name">' + esc(r.name) + '</div>'
      + '<div class="rc-id">ID: ' + esc(r.resortId) + '</div>'
      + (r.betaActive  ? '<span class="rc-badge rc-y">Active</span>' : '')
      + (r.active      ? '<span class="rc-badge rc-b" style="margin-left:4px">\u2605 KKBook</span>' : '')
      + (r.hasBookings ? '<span class="rc-badge rc-o" style="margin-left:4px">\uD83D\uDCC5 Online</span>' : '')
      + '</div>';
  }).join('');
}

function selectResort(resortId, name) {
  BACKEND_SESSION = null;
  show('screenEdit');
  document.getElementById('editTitle').textContent = name;
  loadEdit(resortId);
}

async function loadEdit(resortId) {
  showMsg('editMsg', '');
  document.getElementById('btnManageImages').style.display = 'none';
  document.getElementById('editWrap').innerHTML = '<div class="spin-wrap"><div class="spin"></div>Loading resort data...</div>';
  const { data, error } = await sb.from('resorts').select('*').eq('resort_id', resortId).single();
  if (error || !data) {
    document.getElementById('editWrap').innerHTML = '<div class="msg msg-err">' + esc((error && error.message) || 'Resort not found') + '</div>';

  CURRENT_RESORT = sbRowToResort(data);

  renderForm(CURRENT_RESORT);

  }
}

var _accActiveIdx = null;
function accFlushEditor() {
  if (_accActiveIdx === null) return;
  var t = ACCOM_TYPES[_accActiveIdx]; if (!t) return;
  var lel = document.getElementById('f_' + safeId(t.lk));
  var tel = document.getElementById('f_' + safeId(t.tk));
  var edList = document.getElementById('accEditorList');
  var edTxt  = document.getElementById('accEditorTxt');
  if (lel && edList) lel.value = edList.value.split('\n').map(function(s){return s.trim();}).filter(Boolean).join(',');
  if (tel && edTxt)  tel.value = edTxt.value;
}
function selectAccomPill(idx) {
  accFlushEditor(); _accActiveIdx = idx;
  var t = ACCOM_TYPES[idx]; if (!t) return;
  document.querySelectorAll('#accPillRow .acc-pill').forEach(function(p){ p.classList.remove('on'); });
  var pill = document.getElementById('accPill_' + idx);
  if (pill) pill.classList.add('on');
  var lel     = document.getElementById('f_' + safeId(t.lk));
  var tel     = document.getElementById('f_' + safeId(t.tk));
  var edList  = document.getElementById('accEditorList');
  var edTxt   = document.getElementById('accEditorTxt');
  var edTitle = document.getElementById('accEditorTitle');
  if (edTitle) edTitle.textContent = t.label;
  if (edList)  edList.value = lel ? lel.value.split(',').map(function(s){return s.trim();}).filter(Boolean).join('\n') : '';
  if (edTxt)   edTxt.value  = tel ? tel.value : '';
  var panel = document.getElementById('accEditorPanel');
  if (panel) panel.classList.add('on');
}
function updateAccomPills() {
  var row = document.getElementById('accPillRow'); if (!row) return;
  accFlushEditor();
  var ticked = ACCOM_TYPES.filter(function(t) {
    var cb = document.getElementById('f_' + safeId(t.bk)); return cb && cb.checked;
  });
  row.innerHTML = ticked.length
    ? ticked.map(function(t) {
        var on = t.i === _accActiveIdx ? ' on' : '';
        return '<button type="button" class="acc-pill' + on + '" id="accPill_' + t.i + '" onclick="selectAccomPill(' + t.i + ')">' + t.label + '</button>';
      }).join('')
    : '<span style="font-size:12px;color:var(--muted);font-weight:600">Tick accommodation types above to add details</span>';
  if (_accActiveIdx !== null && !ticked.find(function(t){ return t.i === _accActiveIdx; })) {
    _accActiveIdx = null;
    var panel = document.getElementById('accEditorPanel');
    if (panel) panel.classList.remove('on');
  }
}
function toggleSection(secId) {
  var body  = document.getElementById(secId);
  var arrow = document.getElementById('arr_' + secId);
  if (!body) return;
  var isOpen = body.style.display !== 'none' && body.style.display !== '';
  body.style.display = isOpen ? 'none' : 'block';
  if (arrow) arrow.classList.toggle('open', !isOpen);
}

async function setBookingMode(fieldKey, newVal) {
  if (!SESSION || !CURRENT_RESORT) return;
  var resortId = CURRENT_RESORT['resort_id'];
  var bmId = 'bm_' + safeId(fieldKey);
  ['live','indirect'].forEach(function(v) {
    var el = document.getElementById(bmId + '_' + v);
    if (el) el.classList.toggle('selected', v === newVal);
  });
  var hidden = document.getElementById('f_' + safeId(fieldKey));
  if (hidden) hidden.value = newVal;
  const { error } = await sb.from('resorts').update({ [fieldKey]: newVal }).eq('resort_id', resortId);
  if (!error) {
    if (CURRENT_RESORT) CURRENT_RESORT[fieldKey] = newVal;
    showMsg('editMsg', '\u2713 Booking Mode saved', 'ok');
    setTimeout(function(){ showMsg('editMsg',''); }, 2500);
  } else {
    showMsg('editMsg', '\u274C Could not save: ' + error.message, 'err');
  }
}

function driveImgUrl(url) {
  if (!url) return '';
  if (!url.includes('drive.google.com') && !url.includes('docs.google.com')) return url;
  if (url.includes('drive.google.com/thumbnail') || url.includes('lh3.googleusercontent.com')) return url;
  var m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  if (!m) m = url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w400';
  return url;
}

async function saveResort() {
  accFlushEditor();
  var allFields = [];
  var groups = GROUPS.slice();
  if (isKKUser()) groups = groups.concat(SUPER_GROUPS);
  groups.forEach(function(g) {
    (g.fields||[]).forEach(function(f) { allFields.push(f); });
    (g.checkboxes||[]).forEach(function(f) { allFields.push({ key:f.key, type:'checkbox' }); });
  });
  var fields = {};
  allFields.forEach(function(f) {
    var el = document.getElementById('f_' + safeId(f.key));
    if (!el) return;
    fields[f.key] = (f.type === 'checkbox') ? el.checked : el.value;
  });
  ACCOM_TYPES.forEach(function(t) {
    var lel = document.getElementById('f_' + safeId(t.lk));
    var tel = document.getElementById('f_' + safeId(t.tk));
    if (lel) fields[t.lk] = lel.value;
    if (tel) fields[t.tk] = tel.value;
  });
  var resortId = (SESSION.role === 'KampKiepie')
    ? (CURRENT_RESORT ? CURRENT_RESORT['resort_id'] : '')
    : SESSION.resortId;
  fields['last_update'] = new Date().toISOString();
  var saveBtn = document.querySelector('.btn-save');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026';
  const { error } = await sb.from('resorts').update(fields).eq('resort_id', resortId);
  saveBtn.disabled = false; saveBtn.textContent = '\uD83D\uDCBE Save Changes';
  if (!error) {
    kkBust();
    showMsg('editMsg', '\u2705 Changes saved successfully!', 'ok');
    window.scrollTo(0, 0);
  } else {
    showMsg('editMsg', '\u274C ' + (error.message || 'Save failed'), 'err');
  }
}

async function openImageManager() {
  if (!BACKEND_URL) { alert('Booking backend URL not found in config.txt'); return; }
  const folderLink = CURRENT_RESORT && CURRENT_RESORT['drive_folder_link'];
  if (!folderLink) { alert('No Drive folder link found for this resort.'); return; }

  try {
    const session = await getBackendSession();

  } catch(err) {
    document.getElementById('imgGridWrap').innerHTML = '<div class="msg msg-err">' + esc(err.message || String(err)) + '</div>';
  }
}
function closeImgModal() {
  document.getElementById('imgModal').classList.remove('on');
  document.getElementById('imgFileInput').value = '';
}
async function loadImages(folderLink, session) {
  folderLink = folderLink || (CURRENT_RESORT && CURRENT_RESORT['drive_folder_link']);
  session    = session    || await getBackendSession();
  try {
    const res = await apiBackend({ action:'listDriveFolderImages', folderLink, session });
    if (!res.success) throw new Error(res.error || 'Could not load images');
    IMG_LIST = res.images || [];
    const folderEl = document.getElementById('imgModalFolder');
    if (folderEl && res.folderName) folderEl.textContent = res.folderName;
    renderImageGrid(IMG_LIST);
  } catch(err) {
    document.getElementById('imgGridWrap').innerHTML = '<div class="msg msg-err">' + esc(err.message || String(err)) + '</div>';
  }
}
function renderImageGrid(images) {
  const wrap = document.getElementById('imgGridWrap');
  if (!images.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);font-weight:700;">No images in this folder yet. Upload some above!</div>';
    return;
  }
  wrap.innerHTML = '<div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px">'
    + images.length + ' image' + (images.length !== 1 ? 's' : '') + '</div>'
    + '<div class="img-grid-wrap">'
    + images.map(function(img) {
        return '<div class="img-card" id="imgcard_' + esc(img.id) + '">'
          + '<img src="' + esc(img.thumbnail) + '" alt="' + esc(img.name) + '" onerror="this.style.height=\'60px\';this.style.background=\'var(--bg)\'">'
          + '<div class="img-card-name" title="' + esc(img.name) + '">' + esc(img.name) + '</div>'
          + '<div class="img-card-acts">'
          + '<button class="btn-img-rename" onclick="renameImage(\'' + esc(img.id) + '\',\'' + esc(img.name) + '\')">Rename</button>'
          + '<button class="btn-img-delete" onclick="deleteImage(\'' + esc(img.id) + '\',\'' + esc(img.name) + '\')">Delete</button>'
          + '</div></div>';
      }).join('')
    + '</div>';
}
async function handleUpload(files) {
  if (!files || !files.length) return;
  const folderLink = CURRENT_RESORT && CURRENT_RESORT['drive_folder_link'];
  const prog = document.getElementById('imgUploadProgress');
  prog.innerHTML = '';
  let session;
  try { session = await getBackendSession(); } catch(err) { prog.innerHTML = '<div class="msg msg-err">' + esc(err.message) + '</div>'; return; }
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 10 * 1024 * 1024) {
      prog.innerHTML += '<div class="upload-item"><span class="upload-item-status">\u26A0\uFE0F</span>' + esc(file.name) + ' \u2014 too large (max 10 MB)</div>';
      continue;
    }
    const rowId = 'urow_' + i;
    prog.innerHTML += '<div class="upload-item" id="' + rowId + '"><span class="upload-item-status">\u231B</span>' + esc(file.name) + ' \u2014 uploading\u2026</div>';
    try {
      const base64 = await readFileAsBase64(file);
      const res = await apiBackend({ action:'uploadImageToDrive', folderLink, session, fileName:file.name, mimeType:file.type, imageBase64:base64 }, 'POST');
      const row = document.getElementById(rowId);
      if (res.success) {
        if (row) row.innerHTML = '<span class="upload-item-status">\u2705</span>' + esc(file.name) + ' \u2014 uploaded';
        IMG_LIST.push({ id:res.id, name:res.name, url:res.url, thumbnail:res.thumbnail });
        renderImageGrid(IMG_LIST);
      } else {
        if (row) row.innerHTML = '<span class="upload-item-status">\u274C</span>' + esc(file.name) + ' \u2014 ' + esc(res.error || 'Upload failed');
      }
    } catch(err) {
      const row = document.getElementById(rowId);
      if (row) row.innerHTML = '<span class="upload-item-status">\u274C</span>' + esc(file.name) + ' \u2014 ' + esc(err.message || String(err));
    }
  }
  document.getElementById('imgFileInput').value = '';
}
function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = e => resolve(e.target.result.split(',')[1]);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
async function deleteImage(fileId, name) {
  if (!confirm('Delete "' + name + '"? This cannot be undone.')) return;
  const card = document.getElementById('imgcard_' + fileId);
  if (card) { card.style.opacity = '0.4'; card.style.pointerEvents = 'none'; }
  try {
    const session = await getBackendSession();
    const res = await apiBackend({ action:'deleteImageFromDrive', fileId, session }, 'POST');
    if (res.success) { IMG_LIST = IMG_LIST.filter(img => img.id !== fileId); renderImageGrid(IMG_LIST); }
    else { if (card) { card.style.opacity = ''; card.style.pointerEvents = ''; } alert('Delete failed: ' + (res.error || 'unknown error')); }
  } catch(err) {
    if (card) { card.style.opacity = ''; card.style.pointerEvents = ''; }
    alert('Delete failed: ' + (err.message || String(err)));
  }
}
async function renameImage(fileId, currentName) {
  const ext      = currentName.includes('.') ? '.' + currentName.split('.').pop() : '';
  const baseName = currentName.includes('.') ? currentName.slice(0, currentName.lastIndexOf('.')) : currentName;
  const newBase  = prompt('Rename "' + currentName + '" to:', baseName);
  if (!newBase || newBase.trim() === baseName) return;
  const newName = newBase.trim() + ext;
  const card = document.getElementById('imgcard_' + fileId);
  if (card) { card.style.opacity = '0.5'; card.style.pointerEvents = 'none'; }
  try {
    const session = await getBackendSession();
    const res = await apiBackend({ action:'renameImageInDrive', fileId, newName, session }, 'POST');
    if (res.success) { const img = IMG_LIST.find(i => i.id === fileId); if (img) img.name = newName; renderImageGrid(IMG_LIST); }
    else { if (card) { card.style.opacity = ''; card.style.pointerEvents = ''; } alert('Rename failed: ' + (res.error || 'unknown error')); }
  } catch(err) {
    if (card) { card.style.opacity = ''; card.style.pointerEvents = ''; }
    alert('Rename failed: ' + (err.message || String(err)));
  }
}

  try {
    if (!BACKEND_URL) throw new Error('adminbackend_script not set in config.txt');
    var params = new URLSearchParams({ action:'generateSitemap', siteBase:'https://kampkiepie.co.za/NewKiepie', _ts: Date.now() });
    var genRes  = await fetch(BACKEND_URL + '?' + params.toString(), { cache:'no-store' });
    var genData = await genRes.json();
    if (!genData.success) throw new Error('Sitemap generation failed: ' + genData.error);
    if (btn) btn.textContent = 'Uploading\u2026';
    var uploadRes  = await fetch('../update-sitemap.php', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams({ key:SITEMAP_SECRET, xml:genData.xml, file:'sitemap-resorts.xml' }) });
    var uploadData = await uploadRes.json();
    if (!uploadData.success) throw new Error('Upload failed: ' + uploadData.error);
    alert('\u2705 sitemap-resorts.xml updated\n' + genData.count + ' resort URLs \u2014 ' + uploadData.bytes + ' bytes\nUpdated: ' + uploadData.updated);
  } catch(err) {
    alert('\u274C ' + (err.message || err));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '\uD83D\uDDFA\uFE0F Update Resort Sitemap'; }
  }
}

// ── BOOKING BACKEND HANDOFF ───────────────────────────────────────────────────
async function goToBookingBackend() {
  if (!SESSION) return;
  const resortId = SESSION.role === 'KampKiepie'
    ? (CURRENT_RESORT ? CURRENT_RESORT['resort_id'] : '')
    : SESSION.resortId;
  const btn = document.getElementById('btnManageBookings');
  if (btn) { btn.disabled = true; btn.textContent = 'Opening\u2026'; }
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) throw new Error('Not authenticated');
    const res = await apiBackend({ action:'mintBootstrapFromJWT', token: session.access_token, resortId });
    if (!res.success) throw new Error(res.error || 'Could not open booking system');
    window.location.href = '../adminbackend.html?resort=' + encodeURIComponent(resortId) + '&token=' + encodeURIComponent(res.token);
  } catch(err) {
    alert('Could not open booking system: ' + (err.message || err));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '\uD83D\uDCC5 Manage Bookings'; }
  }
}

// ── UTILITIES ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async function() {
  document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') handleLogin(); });
  document.getElementById('loginEmail').addEventListener('keydown',    e => { if(e.key==='Enter') document.getElementById('loginPassword').focus(); });
  var npf = document.getElementById('newPassField');
  var cpf = document.getElementById('confirmPassField');
  if (npf) npf.remove();
  if (cpf) cpf.remove();
  await loadConfig();
  const { data: { session } } = await sb.auth.getSession();
  if (session) { startSession(session.user); } else { show('screenLogin'); }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') {
      SESSION = null; BACKEND_SESSION = null;
      show('screenLogin');
      document.getElementById('hdrUser').style.display = 'none';
    }
  });
});
